<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14100c">
<title>The Midnight Protocol · Colic Protocol</title>
<meta name="description" content="A step-by-step protocol for colic crisis moments. Evidence-informed. Works in minutes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   COLIC PROTOCOL — MIDNIGHT PROTOCOL
   Dark-mode design system. Warm, low-blue-light palette on
   purpose — the same "dim warm light, not total darkness"
   principle the protocol itself teaches applies to the screen
   a parent is staring at at 3AM.
   ============================================================ */
:root{
  --bg:#14100c; --bg-soft:#191410; --card:#1f1910; --card-2:#251d14;
  --border:rgba(244,237,228,0.09); --border-strong:rgba(244,237,228,0.17);
  --cream:#f5efe6; --muted:#ab9c8b; --muted-2:#756652;
  --terra:#dd8058; --terra-soft:rgba(221,128,88,0.15); --terra-line:rgba(221,128,88,0.45); --terra-deep:#c4603a;
  --sage:#93b394; --sage-soft:rgba(147,179,148,0.15); --sage-line:rgba(147,179,148,0.45);
  --gold:#e0bd75; --gold-soft:rgba(224,189,117,0.15); --gold-line:rgba(224,189,117,0.45);
  --blush:#e6a189; --blush-soft:rgba(230,161,137,0.15); --blush-line:rgba(230,161,137,0.45);
  --red:#e2685c; --red-soft:rgba(226,104,92,0.15); --red-line:rgba(226,104,92,0.5);
  --green:#8fbf9a;
  --shadow:0 24px 70px rgba(0,0,0,0.55);
  --r-lg:24px; --r-md:16px; --r-sm:11px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 720px 520px at 12% 6%, rgba(221,128,88,0.17), transparent 60%),
    radial-gradient(ellipse 640px 520px at 88% 94%, rgba(147,179,148,0.13), transparent 60%),
    radial-gradient(ellipse 900px 800px at 50% 45%, rgba(224,189,117,0.055), transparent 70%),
    #0a0705;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--sans); color:var(--cream);
  padding:22px 12px; -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;}
button{-webkit-tap-highlight-color:transparent;}
::selection{background:var(--terra-soft); color:var(--cream);}

.phone{
  width:100%; max-width:436px; min-height:min(870px,94vh);
  background:var(--bg); border-radius:34px; border:1px solid var(--border-strong);
  box-shadow:var(--shadow), 0 0 0 1px rgba(0,0,0,0.35);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
}
.phone::before{
  content:''; position:absolute; top:-120px; left:50%; transform:translateX(-50%);
  width:340px; height:260px; border-radius:50%;
  background:radial-gradient(ellipse, rgba(224,189,117,0.16), transparent 68%);
  pointer-events:none; z-index:0;
}
#app{position:relative; z-index:1; flex:1; display:flex; flex-direction:column;}

@media (max-width:480px){
  body{padding:0;}
  .phone{max-width:100%; min-height:100vh; border-radius:0; border:none; box-shadow:none;}
  .phone::before{display:none;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

/* ── layout ─────────────────────────────────────────────── */
.screen{display:flex; flex-direction:column; flex:1; padding:30px 22px 24px; animation:screenIn .4s cubic-bezier(.16,1,.3,1);}
.screen.center{justify-content:center;}
.screen-body{flex:1; display:flex; flex-direction:column;}
.screen-foot{margin-top:16px;}
@keyframes screenIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}

.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.17em; text-transform:uppercase; margin-bottom:11px; display:flex; align-items:center; gap:9px; font-weight:500;}
.eyebrow::before{content:''; width:18px; height:1px; background:currentColor; opacity:.65;}

.h1{font-family:var(--serif); font-size:29px; font-weight:700; line-height:1.14; margin:0 0 10px; color:var(--cream); letter-spacing:-.01em;}
.h1 i{font-style:italic; color:var(--terra); font-weight:600;}
.h2{font-family:var(--serif); font-size:22px; font-weight:700; line-height:1.2; margin:0 0 8px;}
.sub{color:var(--muted); font-size:14px; line-height:1.68; margin-bottom:4px;}
.center-text{text-align:center;}

/* ── stage progress dots ────────────────────────────────── */
.dots{display:flex; gap:7px; justify-content:center; margin-bottom:20px;}
.dot{height:6px; border-radius:4px; background:var(--border-strong); transition:all .35s ease; width:6px;}
.dot.active{width:22px;}
.dot.done{opacity:.55;}

/* ── step bar (sub-steps within a stage) ────────────────── */
.stepbar{display:flex; gap:4px; margin-bottom:18px;}
.stepbar i{flex:1; height:3px; border-radius:2px; background:var(--border-strong); font-style:normal;}
.stepbar i.on{background:currentColor;}
.stepbar i.past{background:currentColor; opacity:.45;}

/* ── buttons ────────────────────────────────────────────── */
.btn{width:100%; min-height:54px; border-radius:15px; border:none; font-weight:700; font-size:15.5px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, filter .15s ease, opacity .15s ease; letter-spacing:.005em;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,#e8935f,var(--terra-deep)); color:#1c0f07; box-shadow:0 10px 26px rgba(221,128,88,.3);}
.btn-primary:hover{filter:brightness(1.05);}
.btn-sage{background:linear-gradient(135deg,#a8c9a8,#6f9373); color:#0e1710; box-shadow:0 10px 26px rgba(147,179,148,.24);}
.btn-ghost{background:rgba(244,237,228,.05); color:var(--cream); border:1px solid var(--border-strong);}
.btn-outline{background:transparent; border:1.5px solid var(--terra-line); color:var(--terra); box-shadow:none;}
.btn-outline.sage{border-color:var(--sage-line); color:var(--sage);}
.btn-link{background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:8px;}
.btn:disabled{opacity:.38; cursor:not-allowed; filter:grayscale(.3);}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
a.btn{text-decoration:none;}
.field:focus-visible,.btn:focus-visible,.toggle-row:focus-visible,.opt:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

/* ── cards ──────────────────────────────────────────────── */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:18px 17px;}
.card.tint-terra{background:linear-gradient(180deg, rgba(221,128,88,.09), rgba(221,128,88,.03)); border-color:var(--terra-line);}
.card.tint-sage{background:linear-gradient(180deg, rgba(147,179,148,.09), rgba(147,179,148,.03)); border-color:var(--sage-line);}
.card.tint-gold{background:linear-gradient(180deg, rgba(224,189,117,.09), rgba(224,189,117,.03)); border-color:var(--gold-line);}
.card.tint-blush{background:linear-gradient(180deg, rgba(230,161,137,.09), rgba(230,161,137,.03)); border-color:var(--blush-line);}
.card.tint-red{background:linear-gradient(180deg, rgba(226,104,92,.11), rgba(226,104,92,.04)); border-color:var(--red-line);}
.card + .card{margin-top:12px;}

/* ── form fields ────────────────────────────────────────── */
.field-group{margin-bottom:13px;}
.field{width:100%; min-height:52px; background:var(--card-2); border:1px solid var(--border-strong);
  border-radius:13px; color:var(--cream); font-size:16px; padding:0 16px; outline:none;
  -webkit-appearance:none; appearance:none;}
.field::placeholder{color:var(--muted-2);}
.field.invalid{border-color:var(--red-line);}
.err{color:var(--red); font-size:11.5px; margin-top:6px; line-height:1.5;}
.label-sm{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin-bottom:7px; display:block;}
.consent-row{display:flex; gap:11px; align-items:flex-start; margin-top:14px; cursor:pointer;}
.consent-row input[type=checkbox]{margin-top:3px; width:17px; height:17px; flex-shrink:0; accent-color:var(--terra);}
.consent-row span{color:var(--muted); font-size:12px; line-height:1.6;}

/* ── toggle rows (environment reset) ───────────────────── */
.toggle-row{display:flex; align-items:center; gap:13px; padding:13px 2px; cursor:pointer; user-select:none;}
.toggle-row + .toggle-row{border-top:1px solid var(--border);}
.toggle-box{width:25px; height:25px; border-radius:8px; border:1.5px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s ease; background:var(--card-2);}
.toggle-row.on .toggle-box{background:var(--sage); border-color:var(--sage);}
.toggle-box svg{width:14px; height:14px; opacity:0; transition:opacity .15s;}
.toggle-row.on .toggle-box svg{opacity:1;}
.toggle-text b{display:block; font-size:14px; font-weight:600; color:var(--cream); margin-bottom:1px;}
.toggle-text span{font-size:12px; color:var(--muted);}
.progress-track{height:4px; background:var(--border); border-radius:3px; overflow:hidden; margin:16px 0 4px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--sage),#b3d0b3); border-radius:3px; transition:width .4s ease;}

/* ── danger / quick-check items ─────────────────────────── */
.danger-item{display:flex; align-items:center; gap:13px; padding:14px 4px; cursor:pointer;}
.danger-item + .danger-item{border-top:1px solid var(--border);}
.danger-check{width:25px; height:25px; border-radius:50%; border:1.5px solid var(--red-line);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .15s;}
.danger-item.on .danger-check{background:var(--red);}
.danger-check svg{width:13px; height:13px; opacity:0;}
.danger-item.on .danger-check svg{opacity:1;}
.danger-item b{font-size:14px; font-weight:600; line-height:1.4;}

/* ── outcome / choice buttons ───────────────────────────── */
.opt{width:100%; min-height:60px; border-radius:15px; text-align:left; padding:0 18px;
  display:flex; align-items:center; gap:13px; font-weight:600; font-size:14.5px;
  border:1px solid; cursor:pointer; margin-bottom:10px; background:none; color:var(--cream); transition:transform .12s;}
.opt:active{transform:scale(.98);}
.opt:last-child{margin-bottom:0;}
.opt .dot-ind{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.opt-good{border-color:var(--sage-line); background:var(--sage-soft);}
.opt-good .dot-ind{background:var(--sage);}
.opt-mid{border-color:var(--gold-line); background:var(--gold-soft);}
.opt-mid .dot-ind{background:var(--gold);}
.opt-low{border-color:var(--red-line); background:var(--red-soft);}
.opt-low .dot-ind{background:var(--red);}

/* ── illustration frame ─────────────────────────────────── */
.illus{width:100%; border-radius:18px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border); background:#0e0b07; position:relative;}
.illus img{width:100%; display:block;}

/* ── instructions list ──────────────────────────────────── */
.steps-list{list-style:none; margin:0 0 6px; padding:0; counter-reset:step;}
.steps-list li{counter-increment:step; display:flex; gap:12px; padding:9px 0; font-size:13.5px; line-height:1.6; color:var(--cream);}
.steps-list li::before{content:counter(step); font-family:var(--mono); font-size:11px; font-weight:600;
  width:22px; height:22px; border-radius:50%; background:var(--card-2); border:1px solid var(--border-strong);
  color:var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}

/* ── timer ──────────────────────────────────────────────── */
.timer-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; margin:14px 0 6px;}
.timer-ring{position:relative; width:128px; height:128px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-digits{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;}
.timer-digits .t{font-family:var(--mono); font-size:23px; font-weight:600; color:var(--cream);}
.timer-digits .p{width:9px; height:9px; border-radius:50%; margin-top:6px; animation:pulse60 1s ease-in-out infinite;}
@keyframes pulse60{0%,100%{transform:scale(1); opacity:.5;} 50%{transform:scale(1.5); opacity:1;}}
.timer-controls{display:flex; gap:8px;}
.timer-btn{min-height:42px; padding:0 18px; border-radius:11px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid var(--border-strong); background:rgba(244,237,228,.05); color:var(--cream);}
.timer-note{font-size:11.5px; color:var(--muted-2); text-align:center; max-width:230px;}
.timer-done-note{font-size:12px; color:var(--sage); font-weight:600; text-align:center;}

/* ── breathing orb ──────────────────────────────────────── */
.orb-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0;}
.orb{border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all .8s cubic-bezier(.45,0,.55,1); border:2px solid; }
.orb .n{font-family:var(--serif); font-weight:700;}

/* ── value stack ─────────────────────────────────────────── */
.vs-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0;}
.vs-row + .vs-row{border-top:1px solid var(--border);}
.vs-row .nm{display:flex; gap:9px; align-items:flex-start; font-size:13px; color:var(--cream); line-height:1.5;}
.vs-row .nm svg{flex-shrink:0; margin-top:2px; width:14px; height:14px; color:var(--sage);}
.vs-row .val{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap;}
.vs-total{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding:13px 14px;
  background:var(--sage-soft); border:1px solid var(--sage-line); border-radius:12px;}
.vs-total .lbl{font-size:13.5px; font-weight:700; color:var(--cream);}
.vs-total .amt{font-family:var(--serif); font-size:23px; font-weight:700; color:var(--sage);}

/* ── 3-system cards (diagnosis bridge) ─────────────────── */
.sys-card{display:flex; gap:12px; padding:14px; border-radius:14px; border:1px solid var(--border); margin-bottom:10px; align-items:flex-start;}
.sys-card .ic{width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.sys-card .ic svg{width:19px; height:19px;}
.sys-card b{display:block; font-size:13.5px; margin-bottom:3px;}
.sys-card p{margin:0; font-size:12px; color:var(--muted); line-height:1.55;}

/* ── expandable ("why does colic peak..." aside) ────────── */
.expand{border:1px solid var(--border); border-radius:14px; overflow:hidden;}
.expand summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600; color:var(--cream);}
.expand summary::-webkit-details-marker{display:none;}
.expand summary .chev{transition:transform .2s; color:var(--muted); flex-shrink:0;}
.expand[open] summary .chev{transform:rotate(180deg);}
.expand .expand-body{padding:0 16px 16px;}
.expand .expand-body img{width:100%; border-radius:12px; display:block;}

/* ── misc ───────────────────────────────────────────────── */
.spacer{flex:1;}
.trust-line{display:flex; gap:9px; align-items:center; font-size:11.5px; color:var(--muted-2); margin-top:16px; justify-content:center; text-align:center; line-height:1.5;}
.divider{height:1px; background:var(--border); margin:18px 0;}
.big-num{font-family:var(--serif); font-weight:800; letter-spacing:.02em;}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:5px 11px; border-radius:20px; border:1px solid;}
.badge-clear{color:var(--sage); border-color:var(--sage-line); background:var(--sage-soft);}
.skiplink{text-align:center; margin-top:10px;}
img{max-width:100%;}
</style>
</head>
<body>
<div class="phone"><div id="app"></div></div>
<script>
(function(){
'use strict';

/* ============================================================
   CONFIG
   The MailerLite API key never appears in this file, ever — it
   lives server-side as a Cloudflare env var and is read by the
   serverless function at CONFIG.ENDPOINT (a sibling of the
   quiz's /api/subscribe, sharing its helper conventions but
   kept as its own route so the quiz's already-working logic
   is never touched). This file only knows a URL to POST to.
   ============================================================ */
var CONFIG = {
  ENDPOINT: '/api/midnight-subscribe',          // dedicated route — see companion file
  QUIZ_URL: 'quiz.html',                         // confirmed against the real site's flat relative-.html links
  BLUEPRINT_URL: 'https://colicprotocol.gumroad.com/l/TheCalmBabyBlueprint',
  SOURCE: 'midnight_protocol'
};

/* Same three canonical labels the quiz's RESULTS object and
   subscribe.js's VALID_COLIC_TYPES already use. Reusing these
   verbatim, rather than inventing a parallel vocabulary, is
   what lets one MailerLite record built from a quiz visit and
   a checklist visit agree with each other. Keyed by the same
   short codes getPrimaryType() in quiz.html already returns,
   so a quiz→checklist link only ever has to pass ?type=GUT. */
var TYPE_MAP = {
  GUT: { label:'Gut Microbiome Imbalance', emoji:'\uD83E\uDD20', short:'gut' },
  NS:  { label:'Nervous System Dysregulation', emoji:'\u26A1', short:'nervous' },
  AC:  { label:'Acoustic Environment Overload', emoji:'\uD83C\uDFB5', short:'acoustic' }
};

/* Session identifier, same shape as the quiz's ASSESSMENT_ID
   (CP-year-rand5) but MP-prefixed so the two are distinguishable
   at a glance in MailerLite or in the Gumroad ?ref= Zapier match. */
var ASSESSMENT_ID = (function(){
  var year = new Date().getFullYear();
  var rand = String(Math.floor(Math.random()*99999)).padStart(5,'0');
  return 'MP-' + year + '-' + rand;
})();
var SESSION_STARTED_AT = Date.now(); // bot-speed trap, mirrors quiz's quizStartedAt

/* ============================================================
   STATE
   ============================================================ */
var state = {
  screen: 'welcome',
  lead: { name:'', email:'', babyAgeWeeks:'', consent:false },
  utm: { utm_source: CONFIG.SOURCE, utm_medium:'', utm_campaign:'', utm_term:'', utm_content:'' },
  colicType: '',           // '' | 'GUT' | 'NS' | 'AC' | 'UNSURE'
  colicTypeFromQuiz: false,// true if it arrived pre-filled via ?type=
  quick: { diaper:null, fed:null },
  outcomes: { environment:null, tigerHold:null, final:null },
  cleanups: []
};

(function captureUTMandHandoff(){
  try{
    var p = new URLSearchParams(window.location.search);
    state.utm.utm_source = p.get('utm_source') || CONFIG.SOURCE;
    state.utm.utm_medium = p.get('utm_medium') || '';
    state.utm.utm_campaign = p.get('utm_campaign') || '';
    state.utm.utm_term = p.get('utm_term') || '';
    state.utm.utm_content = p.get('utm_content') || '';
    var t = (p.get('type') || '').toUpperCase();
    if (TYPE_MAP[t]){ state.colicType = t; state.colicTypeFromQuiz = true; }
    // Pre-fill from a quiz handoff so this reads as one experience,
    // not two separate forms. Email deliberately never travels in a
    // URL (browser history, referrer headers), so that field, and the
    // consent checkbox for THIS tool's emails, are always asked fresh.
    var nameParam = (p.get('name') || '').trim();
    var ageParam = p.get('age');
    if (nameParam) state.lead.name = nameParam.slice(0, 60);
    if (ageParam !== null && ageParam !== '' && !isNaN(Number(ageParam))){
      var ageNum = Number(ageParam);
      if (ageNum >= 0 && ageNum <= 60) state.lead.babyAgeWeeks = ageNum;
    }
  }catch(e){}
})();

function withUTM(url, campaign){
  try{
    var isAbsolute = /^https?:\/\//i.test(url);
    var u = new URL(url, window.location.origin);
    u.searchParams.set('utm_source', state.utm.utm_source);
    u.searchParams.set('utm_medium', state.utm.utm_medium || 'midnight_protocol');
    u.searchParams.set('utm_campaign', campaign || state.utm.utm_campaign || 'midnight_protocol');
    return isAbsolute ? u.href : (u.pathname + u.search);
  }catch(e){ return url; }
}

/* ============================================================
   NETWORK — deliberately fire-and-forget. A parent mid-crisis
   should never wait on, or be blocked by, a network call. Every
   post() is non-blocking and every caller ignores the result.

   Field names below intentionally mirror subscribe.js /
   quiz.html: name, email, colic_type, baby_age_weeks, consent,
   lead_source, utm_*, assessment_id, purchase_status. Anything
   checklist-specific (checklist_status, checklist_last_stage,
   checklist_run_count) is additive, never a competing field for
   something the quiz already owns.
   ============================================================ */
function post(extra){
  try{
    var body = Object.assign({
      name: state.lead.name,
      email: state.lead.email,
      website: state.lead.hp || '',    // honeypot passthrough, always blank for real submits
      consent: !!state.lead.consent,
      baby_age_weeks: state.lead.babyAgeWeeks,
      colic_type: state.colicType ? (TYPE_MAP[state.colicType] ? TYPE_MAP[state.colicType].label : 'Unassigned') : '',
      colic_type_detail: state.colicTypeFromQuiz ? 'Confirmed from quiz handoff' : (state.colicType ? 'Selected in Midnight Protocol' : ''),
      assessment_id: ASSESSMENT_ID,
      lead_source: state.utm.utm_source,
      checklist_version: '1.0',
      purchase_status: 'pending'
    }, state.utm, extra || {});
    fetch(CONFIG.ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      keepalive:true,
      body: JSON.stringify(body)
    })['catch'](function(){ /* swallow — see note above */ });
  }catch(e){ /* never let this break the flow */ }
}
function submitLead(){
  var isBot = (Date.now() - SESSION_STARTED_AT) < 1500; // mirrors quiz's bot-speed trap
  if (isBot) return;
  post({ checklist_status:'started', checklist_last_stage:'welcome' });
}
function markStage(stageName, extra){
  if (!state.lead.email) return; // no lead yet, nothing to attach this to
  post(Object.assign({ checklist_status:'in_progress', checklist_last_stage: stageName }, extra || {}));
}
function submitOutcome(stage, result){
  if (!state.lead.email) return;
  var extra = { checklist_status:'in_progress', checklist_last_stage: stage };
  extra[stage + '_outcome'] = result;
  post(extra);
}
function submitCompleted(){
  if (!state.lead.email) return;
  post({ checklist_status:'completed', checklist_last_stage:'bridge' });
}

/* ============================================================
   TIMER — circular countdown, self-contained. mount() builds
   its own DOM into a container and manages its own interval;
   returns a cleanup fn that the router calls on navigation so
   nothing keeps ticking in the background across screens.
   ============================================================ */
function mountTimer(container, opts){
  var seconds = opts.seconds, color = opts.color || 'var(--terra)',
      pulse = !!opts.pulse, onDone = opts.onDone || function(){}, label = opts.label;
  var rem = seconds, live = false, done = false, interval = null;
  var R = 50, C = 2*Math.PI*R;

  var wrap = document.createElement('div');
  wrap.className = 'timer-wrap';
  wrap.innerHTML =
    '<div class="timer-ring">' +
      '<svg width="128" height="128" viewBox="0 0 128 128">' +
        '<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="var(--border-strong)" stroke-width="6"/>' +
        '<circle class="ring-fg" cx="64" cy="64" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="6" ' +
          'stroke-dasharray="'+C+'" stroke-dashoffset="0" stroke-linecap="round"/>' +
      '</svg>' +
      '<div class="timer-digits"><span class="t"></span>'+(pulse?'<span class="p" style="background:'+color+'"></span>':'')+'</div>' +
    '</div>' +
    '<div class="timer-controls"></div>' +
    '<div class="timer-note-slot"></div>';
  container.appendChild(wrap);

  var ringFg = wrap.querySelector('.ring-fg');
  var digitEl = wrap.querySelector('.t');
  var controls = wrap.querySelector('.timer-controls');
  var noteSlot = wrap.querySelector('.timer-note-slot');

  function fmt(s){ var m = Math.floor(s/60), ss = s%60; return m + ':' + (ss<10?'0':'') + ss; }
  function paint(){
    digitEl.textContent = done ? '✓' : fmt(rem);
    var off = C * (1 - rem/seconds);
    ringFg.setAttribute('stroke-dashoffset', done ? 0 : off);
  }
  function renderControls(){
    controls.innerHTML = '';
    if (!live && !done){
      var b = document.createElement('button');
      b.className = 'timer-btn'; b.type = 'button';
      b.textContent = rem < seconds ? '▶ Resume' : ('▶ Start ' + (seconds>=60 ? Math.round(seconds/60)+'-min timer' : seconds+'s timer'));
      b.onclick = start;
      controls.appendChild(b);
    }
    if (live){
      var p = document.createElement('button');
      p.className = 'timer-btn'; p.type = 'button'; p.textContent = '⏸ Pause';
      p.onclick = pause;
      controls.appendChild(p);
    }
    if (done || (!live && rem < seconds)){
      var r = document.createElement('button');
      r.className = 'timer-btn'; r.type = 'button'; r.textContent = '↺';
      r.onclick = reset;
      controls.appendChild(r);
    }
    noteSlot.innerHTML = done
      ? '<div class="timer-done-note">Complete — tap next step</div>'
      : (label ? '<div class="timer-note">'+label+'</div>' : '');
  }
  function tick(){
    rem -= 1;
    if (rem <= 0){
      rem = 0; live = false; done = true;
      clearInterval(interval); interval = null;
      paint(); renderControls();
      onDone();
      return;
    }
    paint();
  }
  function start(){
    if (live || done) return;
    live = true;
    paint(); renderControls();
    interval = setInterval(tick, 1000);
  }
  function pause(){
    live = false;
    if (interval) clearInterval(interval);
    interval = null;
    renderControls();
  }
  function reset(){
    live = false; done = false; rem = seconds;
    if (interval) clearInterval(interval);
    interval = null;
    paint(); renderControls();
  }
  paint(); renderControls();

  return function cleanup(){ if (interval) clearInterval(interval); };
}

/* ============================================================
   BREATHING ORB — used once, on the parent-reset screen
   ============================================================ */
function mountBreathingOrb(container, onDone){
  var t = 0, timeout = null, stopped = false;
  var TOTAL = 21; // ~3 breaths at 7s each (in 3 / hold 1 / out 3)
  var wrap = document.createElement('div');
  wrap.className = 'orb-wrap';
  wrap.innerHTML =
    '<div class="orb" style="width:110px;height:110px;background:rgba(224,189,117,0.12);border-color:var(--gold);">' +
      '<span class="n" style="font-size:30px;color:var(--gold);"></span>' +
    '</div>' +
    '<div class="lbl" style="margin-top:16px;font-size:15px;font-weight:600;color:var(--gold);min-height:20px;"></div>' +
    '<div class="cyc" style="font-size:11.5px;color:var(--muted-2);margin-top:5px;"></div>';
  container.appendChild(wrap);
  var orb = wrap.querySelector('.orb');
  var num = wrap.querySelector('.n');
  var lbl = wrap.querySelector('.lbl');
  var cyc = wrap.querySelector('.cyc');

  function frame(){
    if (stopped) return;
    if (t >= TOTAL){ onDone(); return; }
    var pos = t % 7;
    var phase = pos < 3 ? 'in' : pos < 4 ? 'hold' : 'out';
    var count = phase === 'in' ? (3 - pos) : phase === 'hold' ? 1 : (7 - pos);
    var cycleNum = Math.floor(t/7) + 1;
    var sz = phase === 'out' ? 78 : 118;
    var col = phase === 'in' ? '#93b394' : phase === 'hold' ? '#e0bd75' : '#dd8058';
    orb.style.width = sz+'px'; orb.style.height = sz+'px';
    orb.style.borderColor = col; orb.style.background = col.replace(')', ',0.14)').replace('#','rgba(').length ? hexToRgba(col,0.14) : col;
    num.style.color = col; num.textContent = count;
    lbl.textContent = phase === 'in' ? 'Breathe in…' : phase === 'hold' ? 'Hold…' : 'Breathe out, slowly…';
    lbl.style.color = col;
    cyc.textContent = 'Breath ' + cycleNum + ' of 3';
    t++;
    timeout = setTimeout(frame, 1000);
  }
  function hexToRgba(hex, a){
    var v = hex.replace('#','');
    var r = parseInt(v.substring(0,2),16), g = parseInt(v.substring(2,4),16), b = parseInt(v.substring(4,6),16);
    return 'rgba('+r+','+g+','+b+','+a+')';
  }
  frame();
  return function cleanup(){ stopped = true; if (timeout) clearTimeout(timeout); };
}

var root;
function runCleanups(){
  state.cleanups.forEach(function(fn){ try{ fn(); }catch(e){} });
  state.cleanups = [];
}

  runCleanups();

  render();

}
function render(){
  root.innerHTML = '';
  var s = SCREENS[state.screen];
  var built = s();
  root.appendChild(built.el);
  if (built.mount) built.mount();
}

/* ============================================================
   SCREEN 1 — WELCOME + CAPTURE (combined, per brief)
   ============================================================ */
function renderWelcome(){
  var fromQuizNote = state.colicTypeFromQuiz
    ? '<div class="pill" style="border-color:var(--sage-line); color:var(--sage); background:var(--sage-soft); margin-bottom:16px;">\u2713 Picked up from your assessment</div>'
    : '';
  var html =
    '<div class="screen-body">' +
      '<div class="eyebrow" style="color:var(--terra)">Colic Protocol · Midnight Protocol</div>' +
      '<h1 class="h1">Your baby won\u2019t<br>stop crying?</h1>' +
      '<p class="sub">Let\u2019s go step by step, together. Most parents notice a shift in the first few minutes. Tell us who to walk through it, and let\u2019s start.</p>' +
      fromQuizNote +
      '<div style="margin-top:18px;">' +
        '<div class="field-group">' +
          '<label class="label-sm">Your first name</label>' +
          '<input class="field" data-f="name" type="text" inputmode="text" autocomplete="given-name" placeholder="First name" value="'+esc(state.lead.name)+'">' +
          '<div class="err" data-err="name" hidden></div>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="label-sm">Baby\u2019s age, in weeks</label>' +
          '<input class="field" data-f="age" type="number" inputmode="numeric" min="0" max="60" placeholder="e.g. 5" value="'+esc(state.lead.babyAgeWeeks)+'">' +
          '<div class="err" data-err="age" hidden></div>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="label-sm">Email</label>' +
          '<input class="field" data-f="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">' +
          '<div class="err" data-err="email" hidden></div>' +
        '</div>' +
        '<label class="consent-row">' +
          '<input type="checkbox" data-f="consent">' +
          '<span>Send me this protocol by email and occasional evidence-based colic guidance from Colic Protocol. Unsubscribe anytime.</span>' +
        '</label>' +
        '<div class="err" data-err="consent" hidden></div>' +
        '<input type="text" data-f="hp" name="website" autocomplete="off" tabindex="-1" aria-hidden="true" style="position:absolute; left:-9999px; width:1px; height:1px; opacity:0;">' +
      '</div>' +
      '<div class="spacer" style="display:flex; align-items:center; justify-content:center; min-height:70px;">' +
        '<svg width="120" height="60" viewBox="0 0 120 60" style="opacity:.5;">' +
          '<path d="M46 30a16 16 0 1 0 16-16 12.5 12.5 0 0 0 -16 16Z" fill="none" stroke="var(--gold)" stroke-width="1.3"/>' +
          '<circle cx="20" cy="16" r="1.4" fill="var(--muted-2)"/><circle cx="14" cy="30" r="1" fill="var(--muted-2)"/>' +
          '<circle cx="94" cy="20" r="1.3" fill="var(--muted-2)"/><circle cx="102" cy="38" r="1" fill="var(--muted-2)"/>' +
          '<circle cx="26" cy="44" r="1" fill="var(--muted-2)"/>' +
        '</svg>' +
      '</div>' +
    '</div>' +
    '<div class="screen-foot">' +
      '<button class="btn btn-primary" data-act="start">Start the Midnight Protocol →</button>' +
      '<div class="trust-line">Built by an epidemiologist and dad who spent his own week 3 at 2AM here too. Free. No card.</div>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    var errName = $(el,'[data-err=name]'), errAge = $(el,'[data-err=age]'),
        errEmail = $(el,'[data-err=email]'), errConsent = $(el,'[data-err=consent]');
    $(el,'[data-act=start]').addEventListener('click', function(){
      var name = $(el,'[data-f=name]').value.trim();
      var age = $(el,'[data-f=age]').value.trim();
      var email = $(el,'[data-f=email]').value.trim();
      var consent = $(el,'[data-f=consent]').checked;
      var hp = $(el,'[data-f=hp]').value;
      var nameOK = name.length > 0;
      var ageOK = age !== '' && Number(age) >= 0 && Number(age) <= 60;
      var emailOK = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      errName.hidden = nameOK; errName.textContent = 'Enter a name so we know who we\u2019re talking to.';
      errAge.hidden = ageOK; errAge.textContent = 'Enter baby\u2019s age in weeks (0\u201360).';
      errEmail.hidden = emailOK; errEmail.textContent = 'Enter a valid email, that\u2019s where tonight\u2019s protocol is saved to.';
      errConsent.hidden = consent; errConsent.textContent = 'Check the box to continue, we only send what you agree to.';
      if (!(nameOK && ageOK && emailOK && consent)) return;
      state.lead = { name:name, email:email.toLowerCase(), babyAgeWeeks:Number(age), consent:true, hp:hp };
      submitLead();
      goTo('stopscan');
    });
  }
  return { el:el, mount:mount };
}

/* ============================================================
   SCREEN 2 — STOP & SCAN
   ============================================================ */
function renderStopScan(){
  var dangerHtml = DANGERS.map(function(d){
    return '<div class="danger-item" data-danger="'+d.key+'"><div class="danger-check">'+ICONS.check+'</div><b>'+esc(d.text)+'</b></div>';
  }).join('');
  var html =
    '<div class="screen-body">' +
      '<div class="dots">' + dotsHTML(1) + '</div>' +
      '<div class="eyebrow" style="color:var(--terra)">Stage 1 · Stop &amp; Scan</div>' +
      '<h1 class="h1" style="font-size:25px;">Rule out danger, first.</h1>' +
      '<p class="sub">Quick check before we soothe anything.</p>' +
      '<div class="card tint-red" style="margin-top:16px;">' + dangerHtml + '</div>' +
      '<div class="card" style="margin-top:12px;">' +
        '<div class="toggle-row" data-q="diaper"><div class="toggle-box">'+ICONS.check+'</div><div class="toggle-text"><b>Diaper checked and clean</b><span>Change it before anything else if not</span></div></div>' +
        '<div class="toggle-row" data-q="fed"><div class="toggle-box">'+ICONS.check+'</div><div class="toggle-text"><b>Fed within the last 2 hours</b><span>Hunger can look exactly like colic</span></div></div>' +
      '</div>' +
    '</div>' +
    '<div class="screen-foot">' +
      '<button class="btn btn-sage" data-act="continue">None of the danger signs. Continue →</button>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    $all(el, '.danger-item').forEach(function(row){
      row.addEventListener('click', function(){ goTo('emergency'); });
    });
    $all(el, '.toggle-row').forEach(function(row){
      row.addEventListener('click', function(){ row.classList.toggle('on'); });
    });
    $(el,'[data-act=continue]').addEventListener('click', function(){ goTo('colicType'); });
  }
  return { el:el, mount:mount };
}

/* ============================================================
   SCREEN 2.5 — ALREADY KNOW THE TYPE? (colic type selector)
   Pre-filled and confirm-only if a valid ?type= arrived from a
   quiz result-page link, otherwise a skippable pick list. Either
   way this never blocks progress, "not sure" is a real option,
   and it decides which of the three techniques ahead gets the
   "this matters most for your baby" badge.
   ============================================================ */
function renderColicType(){
  var order = ['GUT','NS','AC'];
  var fromQuiz = state.colicTypeFromQuiz && TYPE_MAP[state.colicType];
  var cardsHtml = order.map(function(code){
    var t = TYPE_MAP[code];

/* ============================================================
   SHARED: technique screen builder (image + steps + timer)
   used by Tiger Hold and the four Gas Release techniques
   ============================================================ */
function buildTechniqueScreen(cfg){
  // cfg: eyebrow, color(css var string e.g. 'var(--gold)'), title, img, steps[], seconds, pulse, timerLabel, continueLabel, onContinue, stageDots(int|null), stepbar{current,total}|null
  var topHtml = '';
  if (cfg.stageDots){ topHtml += '<div class="dots">' + dotsHTML(cfg.stageDots) + '</div>'; }
  topHtml += '<div class="eyebrow" style="color:'+cfg.color+'">'+esc(cfg.eyebrow)+'</div>';
  if (cfg.stepbar){
    var sb = '';
    for (var i=0;i<cfg.stepbar.total;i++){
      sb += '<i class="'+(i<cfg.stepbar.current-1?'past':(i===cfg.stepbar.current-1?'on':''))+'" style="color:'+cfg.color+'"></i>';
    }
    topHtml += '<div class="stepbar">'+sb+'</div>';
  }
  if (cfg.badge){ topHtml += cfg.badge; }
  var stepsHtml = '<ul class="steps-list">' + cfg.steps.map(function(s){ return '<li>'+s+'</li>'; }).join('') + '</ul>';
  var imgHtml = cfg.img ? ('<div class="illus"><img src="'+cfg.img+'" alt="'+esc(cfg.title)+' illustration" loading="lazy"></div>')
                        : (cfg.imgSvg ? ('<div class="illus" style="padding:0;">'+cfg.imgSvg+'</div>') : '');
  var html =
    '<div class="screen-body">' +
      topHtml +
      '<h1 class="h1" style="font-size:24px; margin-bottom:14px;">'+esc(cfg.title)+'</h1>' +
      imgHtml +
      stepsHtml +
      (cfg.safety ? '<div class="card tint-red" style="margin-top:12px; font-size:12px; color:var(--cream); line-height:1.6;"><b style="color:var(--red);">Safety: </b>'+cfg.safety+'</div>' : '') +
      '<div data-timer></div>' +
    '</div>' +
    '<div class="screen-foot">' +
      '<button class="btn btn-primary" data-act="continue" '+(cfg.seconds?'disabled':'')+'>'+esc(cfg.continueLabel||'Done, next →')+'</button>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    var contBtn = $(el,'[data-act=continue]');
    if (cfg.seconds){
      var slot = $(el,'[data-timer]');
      var cleanup = mountTimer(slot, {
        seconds: cfg.seconds, color: cfg.color, pulse: !!cfg.pulse, label: cfg.timerLabel,
        onDone: function(){ contBtn.disabled = false; }
      });
      state.cleanups.push(cleanup);
    }
    contBtn.addEventListener('click', function(){ if(!contBtn.disabled) cfg.onContinue(); });
  }
  return { el:el, mount:mount };
}
