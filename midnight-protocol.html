<style>
:root{
  --bg:#100d0a; --bg-soft:#15100c; --card:rgba(31,25,16,0.78); --card-2:rgba(37,29,20,0.85);
  --border:rgba(244,237,228,0.11); --border-strong:rgba(244,237,228,0.22);
  --cream:#f5efe6; --muted:#ab9c8b; --muted-2:#756652;
  --terra:#dd8058; --terra-soft:rgba(221,128,88,0.16); --terra-line:rgba(221,128,88,0.48); --terra-deep:#c4603a;
  --sage:#93b394; --sage-soft:rgba(147,179,148,0.16); --sage-line:rgba(147,179,148,0.48);
  --gold:#e0bd75; --gold-soft:rgba(224,189,117,0.16); --gold-line:rgba(224,189,117,0.48);
  --blush:#e6a189; --blush-soft:rgba(230,161,137,0.16); --blush-line:rgba(230,161,137,0.48);
  --red:#e2685c; --red-soft:rgba(226,104,92,0.16); --red-line:rgba(226,104,92,0.55);
  --green:#8fbf9a;
  --shadow:0 24px 70px rgba(0,0,0,0.65);
  --shadow-glow:0 0 35px rgba(224,189,117,0.12);
  --r-lg:24px; --r-md:16px; --r-sm:11px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 720px 520px at 12% 6%, rgba(221,128,88,0.18), transparent 60%),
    radial-gradient(ellipse 640px 520px at 88% 94%, rgba(147,179,148,0.15), transparent 60%),
    radial-gradient(ellipse 900px 800px at 50% 45%, rgba(224,189,117,0.065), transparent 70%),
    #080604;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--sans); color:var(--cream);
  padding:22px 12px; -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;}
button{-webkit-tap-highlight-color:transparent;}
::selection{background:var(--terra-soft); color:var(--cream);}

.phone{
  width:100%; max-width:446px; min-height:min(890px,95vh);
  background:linear-gradient(180deg, #16120d 0%, #100d0a 100%);
  border-radius:36px; border:1px solid var(--border-strong);
  box-shadow:var(--shadow), 0 0 40px rgba(221,128,88,0.08);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
}
.phone::before{
  content:''; position:absolute; top:-120px; left:50%; transform:translateX(-50%);
  width:360px; height:280px; border-radius:50%;
  background:radial-gradient(ellipse, rgba(224,189,117,0.18), transparent 68%);
  pointer-events:none; z-index:0;
}
#app{position:relative; z-index:1; flex:1; display:flex; flex-direction:column;}

@media (max-width:480px){
  body{padding:0;}
  .phone{max-width:100%; min-height:100vh; border-radius:0; border:none; box-shadow:none;}
  .phone::before{display:none;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

.screen{display:flex; flex-direction:column; flex:1; padding:28px 22px 24px; animation:screenIn .38s cubic-bezier(.16,1,.3,1);}
.screen.center{justify-content:center;}
.screen-body{flex:1; display:flex; flex-direction:column;}
.screen-foot{margin-top:16px;}
@keyframes screenIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}

.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.17em; text-transform:uppercase; margin-bottom:11px; display:flex; align-items:center; gap:9px; font-weight:500;}
.eyebrow::before{content:''; width:18px; height:1px; background:currentColor; opacity:.65;}

.h1{font-family:var(--serif); font-size:28px; font-weight:700; line-height:1.15; margin:0 0 10px; color:var(--cream); letter-spacing:-.01em;}
.h1 i{font-style:italic; color:var(--terra); font-weight:600;}
.h2{font-family:var(--serif); font-size:22px; font-weight:700; line-height:1.2; margin:0 0 8px;}
.sub{color:var(--muted); font-size:14px; line-height:1.65; margin-bottom:4px;}
.center-text{text-align:center;}

.dots{display:flex; gap:8px; justify-content:center; margin-bottom:20px;}
.dot{height:6px; border-radius:4px; background:rgba(244,237,228,0.18); transition:all .35s ease; width:6px;}
.dot.active{width:24px; background:var(--gold); box-shadow:0 0 10px rgba(224,189,117,0.5);}
.dot.done{background:var(--sage); opacity:.85;}

.stepbar{display:flex; gap:5px; margin-bottom:18px;}
.stepbar i{flex:1; height:3.5px; border-radius:2px; background:rgba(244,237,228,0.14); font-style:normal; transition:background .3s ease;}
.stepbar i.on{background:currentColor; box-shadow:0 0 8px currentColor;}
.stepbar i.past{background:currentColor; opacity:.45;}

.btn{width:100%; min-height:54px; border-radius:15px; border:none; font-weight:700; font-size:15.5px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, filter .15s ease, opacity .15s ease, box-shadow .2s ease; letter-spacing:.005em;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,#e8935f,var(--terra-deep)); color:#190b04; box-shadow:0 10px 28px rgba(221,128,88,.32);}
.btn-primary:hover{filter:brightness(1.06); box-shadow:0 12px 32px rgba(221,128,88,.42);}
.btn-sage{background:linear-gradient(135deg,#a8c9a8,#6f9373); color:#0c170e; box-shadow:0 10px 28px rgba(147,179,148,.26);}

.btn-ghost{background:rgba(244,237,228,.05); color:var(--cream); border:1px solid var(--border-strong);}
.btn-outline{background:rgba(221,128,88,0.04); border:1.5px solid var(--terra-line); color:var(--terra); box-shadow:none;}
.btn-outline:hover{background:var(--terra-soft); border-color:var(--terra);}
.btn-outline.sage{border-color:var(--sage-line); color:var(--sage); background:rgba(147,179,148,0.04);}
.btn-link{background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:8px;}
.btn:disabled{opacity:.35; cursor:not-allowed; filter:grayscale(.35); box-shadow:none;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
a.btn{text-decoration:none;}
.field:focus-visible,.btn:focus-visible,.toggle-row:focus-visible,.opt:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.card{

.card.tint-sage{background:linear-gradient(180deg, rgba(147,179,148,.12), rgba(147,179,148,.04)); border-color:var(--sage-line); box-shadow:0 8px 30px rgba(147,179,148,0.08);}
.card.tint-gold{background:linear-gradient(180deg, rgba(224,189,117,.12), rgba(224,189,117,.04)); border-color:var(--gold-line); box-shadow:0 8px 30px rgba(224,189,117,0.08);}

.field-group{margin-bottom:13px;}
.field{width:100%; min-height:52px; background:var(--card-2); border:1px solid var(--border-strong);
  border-radius:13px; color:var(--cream); font-size:16px; padding:0 16px; outline:none;
  -webkit-appearance:none; appearance:none; transition:border-color .2s, box-shadow .2s;}
.field:focus{border-color:var(--gold); box-shadow:0 0 12px rgba(224,189,117,0.25);}
.field::placeholder{color:var(--muted-2);}

.label-sm{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin-bottom:7px; display:block;}
.consent-row{display:flex; gap:11px; align-items:flex-start; margin-top:14px; cursor:pointer;}
.consent-row input[type=checkbox]{margin-top:3px; width:17px; height:17px; flex-shrink:0; accent-color:var(--terra);}
.consent-row span{color:var(--muted); font-size:12px; line-height:1.6;}

.toggle-row{display:flex; align-items:center; gap:13px; padding:13px 4px; cursor:pointer; user-select:none; border-radius:10px; transition:background .2s ease;}
.toggle-row:hover{background:rgba(244,237,228,0.03);}
.toggle-row + .toggle-row{border-top:1px solid var(--border);}
.toggle-box{width:25px; height:25px; border-radius:8px; border:1.5px solid var(--border-strong);

.toggle-row.on .toggle-box{background:var(--sage); border-color:var(--sage); box-shadow:0 0 12px rgba(147,179,148,0.5);}
.toggle-box svg{width:14px; height:14px; opacity:0; transition:opacity .15s;}
.toggle-box svg path{stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .3s ease;}
.toggle-row.on .toggle-box svg{opacity:1;}
.toggle-row.on .toggle-box svg path{stroke-dashoffset:0;}
.toggle-text{flex:1 1 auto; min-width:0; text-align:left;}

.why-btn{display:block;}
.why-body{max-width:none !important; overflow-wrap:anywhere;}
.toggle-text b{display:block; font-size:14px; font-weight:600; color:var(--cream); margin-bottom:1px;}
.toggle-text span{font-size:12px; color:var(--muted);}
.progress-track{height:4px; background:var(--border); border-radius:3px; overflow:hidden; margin:16px 0 4px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--sage),#b3d0b3); border-radius:3px; transition:width .4s ease; box-shadow:0 0 8px rgba(147,179,148,0.6);}
.why-btn{background:none; border:none; padding:5px 0 0; margin:0; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--sage); cursor:pointer; text-align:left;}

.solidarity-note{display:flex; gap:10px; align-items:flex-start; background:rgba(147,179,148,0.08); border:1px solid var(--sage-line); border-radius:12px; padding:12px 14px; margin-top:14px; font-size:12px; color:var(--cream); line-height:1.6;}
.solidarity-note svg{flex-shrink:0; color:var(--sage); margin-top:1px;}

.danger-item{display:flex; align-items:center; gap:13px; padding:14px 4px; cursor:pointer; border-radius:10px; transition:background .15s;}
.danger-item:hover{background:rgba(226,104,92,0.08);}
.danger-item + .danger-item{border-top:1px solid var(--border);}
.danger-check{width:25px; height:25px; border-radius:50%; border:1.5px solid var(--red-line);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .2s;}
.danger-item.on .danger-check{background:var(--red); box-shadow:0 0 12px rgba(226,104,92,0.6);}
.danger-check svg{width:13px; height:13px; opacity:0;}
.danger-check svg path{stroke-dasharray:20; stroke-dashoffset:20; transition:stroke-dashoffset .25s ease;}
.danger-item.on .danger-check svg{opacity:1;}
.danger-item.on .danger-check svg path{stroke-dashoffset:0;}
.danger-item b{font-size:14px; font-weight:600; line-height:1.4;}

.opt{width:100%; min-height:60px; border-radius:15px; text-align:left; padding:0 18px;
  display:flex; align-items:center; gap:13px; font-weight:600; font-size:14.5px;

.opt:active{transform:scale(.98);}
.opt:last-child{margin-bottom:0;}
.opt .dot-ind{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.opt-good{border-color:var(--sage-line); background:var(--sage-soft);}

.opt-good .dot-ind{background:var(--sage); box-shadow:0 0 8px var(--sage);}
.opt-mid{border-color:var(--gold-line); background:var(--gold-soft);}
.opt-mid:hover{box-shadow:0 0 18px rgba(224,189,117,0.25);}
.opt-mid .dot-ind{background:var(--gold); box-shadow:0 0 8px var(--gold);}
.opt-low{border-color:var(--red-line); background:var(--red-soft);}
.opt-low:hover{box-shadow:0 0 18px rgba(226,104,92,0.25);}
.opt-low .dot-ind{background:var(--red); box-shadow:0 0 8px var(--red);}

.illus{width:100%; border-radius:18px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border); background:#0c0906; position:relative; box-shadow:inset 0 0 30px rgba(0,0,0,0.5);}
.illus svg{width:100%; height:auto; display:block;}

.steps-list{list-style:none; margin:0 0 6px; padding:0; counter-reset:step;}
.steps-list li{counter-increment:step; display:flex; gap:12px; padding:9px 0; font-size:13.5px; line-height:1.6; color:var(--cream);}
.steps-list li::before{content:counter(step); font-family:var(--mono); font-size:11px; font-weight:600;

  color:var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}

.ev-line{font-family:var(--mono); font-size:10.5px; color:var(--muted-2); line-height:1.5; margin:2px 0 4px;}
.tip-hint{font-size:13px; color:var(--muted); background:var(--card-2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-top:12px; line-height:1.55; text-align:center;}
.extra-card{font-size:13px; color:var(--cream); line-height:1.6; margin-bottom:12px;}

.timer-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; margin:14px 0 6px; position:relative;}

@keyframes pulse60{
  0%,100%{transform:scale(1); opacity:.4; filter:drop-shadow(0 0 2px currentColor);}
  50%{transform:scale(1.45); opacity:1; filter:drop-shadow(0 0 10px currentColor);}
}

   frame, which janks on cheap Android phones. */
.metro-active .timer-ring{border-radius:50%; animation:none;}
.metro-active .timer-ring::after{content:'';position:absolute;inset:-6px;border-radius:50%;

  animation:metroPulse 1s ease-in-out infinite}

.orb .n{font-family:var(--serif); font-weight:700;}

.vs-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0;}
.vs-row + .vs-row{border-top:1px solid var(--border);}
.vs-row .nm{display:flex; gap:9px; align-items:flex-start; font-size:13px; color:var(--cream); line-height:1.5;}
.vs-row .nm svg{flex-shrink:0; margin-top:2px; width:15px; height:15px; color:var(--sage);}
.vs-total{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding:14px 16px;
  background:linear-gradient(135deg, rgba(147,179,148,0.18), rgba(147,179,148,0.06));

// Count-up, never-blocking timer for the supported hold. No target
// duration and it never disables the continue button. The ring completes
// one lap per 60 seconds as a pacing aid only. getElapsed() returns total
// active seconds so the screen can record it when the parent moves on.
function mountStopwatch(container, opts){
  var color = (opts && opts.color) || 'var(--gold)', pulse = !!(opts && opts.pulse);
  var elapsed = 0, live = false, interval = null;
  var R = 52, C = 2*Math.PI*R;
  var NOTES = [
    { at:0,   text:'Tap start once your baby is in position and you have found a slow, steady rhythm.' },
    { at:60,  text:'Keep the rhythm slow and steady. There is no fixed time, and no need to push on.' },
    { at:180, text:'Stop whenever your baby, or your arm, needs a break.' }
  ];

  var wrap = document.createElement('div');
  wrap.className = 'timer-wrap' + (pulse ? ' metro-active' : '');
  wrap.innerHTML =
    '<div class="timer-ring">' +
      '<svg width="134" height="134" viewBox="0 0 134 134">' +
        '<circle cx="67" cy="67" r="'+R+'" fill="none" stroke="rgba(244,237,228,0.12)" stroke-width="6"/>' +
        '<circle class="ring-fg" cx="67" cy="67" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="6" ' +
          'stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" stroke-linecap="round"/>' +
      '</svg>' +
      '<div class="timer-digits"><span class="t">0:00</span>'+(pulse?'<span class="p" style="background:'+color+';color:'+color+'"></span>':'')+'</div>' +
    '</div>' +
    (pulse ? '<div class="metro-badge"><span class="metro-dot"></span>Pacing guide: about one pulse per second</div>' : '') +
    '<div class="timer-controls"></div>' +
    '<div class="timer-note-slot"></div>';
  container.appendChild(wrap);

  var ringFg = wrap.querySelector('.ring-fg');
  var digitEl = wrap.querySelector('.t');
  var controls = wrap.querySelector('.timer-controls');
  var noteSlot = wrap.querySelector('.timer-note-slot');

  function fmt(s){ var m = Math.floor(s/60), ss = s%60; return m + ':' + (ss<10?'0':'') + ss; }
  function noteFor(s){
    var n = NOTES[0].text;
    for (var i=0;i<NOTES.length;i++){ if (s >= NOTES[i].at) n = NOTES[i].text; }
    return n;
  }
  function paint(){
    digitEl.textContent = fmt(elapsed);
    var lap = elapsed % 60;
    ringFg.setAttribute('stroke-dashoffset', C * (1 - lap/60));
    noteSlot.innerHTML = '<div class="timer-note">'+noteFor(elapsed)+'</div>';
  }
  function renderControls(){
    controls.innerHTML = '';
    if (!live){
      var b = document.createElement('button');
      b.className = 'timer-btn'; b.type = 'button';
      b.textContent = elapsed > 0 ? '▶ Resume' : '▶ Start';
      b.onclick = start;
      controls.appendChild(b);
    } else {
      var p = document.createElement('button');
      p.className = 'timer-btn'; p.type = 'button'; p.textContent = '⏸ Pause';
      p.onclick = pause;
      controls.appendChild(p);
    }
    if (elapsed > 0){
      var r = document.createElement('button');
      r.className = 'timer-btn'; r.type = 'button'; r.textContent = '↺';
      r.onclick = reset;
      controls.appendChild(r);
    }
  }
  function tick(){ elapsed += 1; paint(); }
  function start(){
    if (live) return;
    live = true;
    paint(); renderControls();
    interval = setInterval(tick, 1000);
  }
  function pause(){
    live = false;
    if (interval) clearInterval(interval);
    interval = null;
    renderControls();
  }
  function reset(){
    live = false; elapsed = 0;
    if (interval) clearInterval(interval);
    interval = null;
    paint(); renderControls();
  }
  paint(); renderControls();

  return {
    cleanup: function(){ if (interval) clearInterval(interval); },
    getElapsed: function(){ return elapsed; }
  };
}

function mountBreathingOrb(container, onDone){
  var t = 0, timeout = null, stopped = false;
  var TOTAL = 21;
  var wrap = document.createElement('div');
  wrap.className = 'orb-wrap';
  wrap.innerHTML =
    '<div class="orb" style="width:110px;height:110px;background:rgba(224,189,117,0.14);border-color:var(--gold);">' +
      '<span class="n" style="font-size:32px;color:var(--gold);"></span>' +
    '</div>' +
    '<div class="lbl" style="margin-top:16px;font-size:15px;font-weight:600;color:var(--gold);min-height:20px;"></div>' +
    '<div class="cyc" style="font-size:11.5px;color:var(--muted-2);margin-top:5px;"></div>';
  container.appendChild(wrap);
  var orb = wrap.querySelector('.orb');
  var num = wrap.querySelector('.n');
  var lbl = wrap.querySelector('.lbl');
  var cyc = wrap.querySelector('.cyc');

  function frame(){
    if (stopped) return;
    if (t >= TOTAL){ onDone(); return; }
    var pos = t % 7;
    var phase = pos < 3 ? 'in' : pos < 4 ? 'hold' : 'out';
    var count = phase === 'in' ? (3 - pos) : phase === 'hold' ? 1 : (7 - pos);
    var cycleNum = Math.floor(t/7) + 1;
    var sz = phase === 'out' ? 82 : 124;
    var col = phase === 'in' ? '#93b394' : phase === 'hold' ? '#e0bd75' : '#dd8058';
    orb.style.width = sz+'px'; orb.style.height = sz+'px';
    orb.style.borderColor = col;
    orb.style.background = col === '#93b394' ? 'rgba(147,179,148,0.18)' : col === '#e0bd75' ? 'rgba(224,189,117,0.18)' : 'rgba(221,128,88,0.18)';
    num.style.color = col; num.textContent = count;
    lbl.textContent = phase === 'in' ? 'Breathe in slowly…' : phase === 'hold' ? 'Hold…' : 'Release and exhale…';
    lbl.style.color = col;
    cyc.textContent = 'Breath ' + cycleNum + ' of 3';
    t++;
    timeout = setTimeout(frame, 1000);
  }
  frame();
  return function cleanup(){ stopped = true; if (timeout) clearTimeout(timeout); };
}

function buildTechniqueScreen(cfg){
  var topHtml = '';
  if (cfg.stageDots){ topHtml += '<div class="dots">' + dotsHTML(cfg.stageDots) + '</div>'; }
  topHtml += '<div class="eyebrow" style="color:'+cfg.color+'">'+esc(cfg.eyebrow)+'</div>';
  if (cfg.stepbar){
    var sb = '';
    for (var i=0;i<cfg.stepbar.total;i++){
      sb += '<i class="'+(i<cfg.stepbar.current-1?'past':(i===cfg.stepbar.current-1?'on':''))+'" style="color:'+cfg.color+'"></i>';
    }
    topHtml += '<div class="stepbar">'+sb+'</div>';
  }
  if (cfg.badge){ topHtml += cfg.badge; }
  var stepsHtml = '<ul class="steps-list">' + cfg.steps.map(function(s){ return '<li>'+s+'</li>'; }).join('') + '</ul>';
  var imgHtml = '<div class="illus" style="padding:0;">' + cfg.svg + '</div>';
  var html =
    '<div class="screen-body">' +
      topHtml +
      '<h1 class="h1" style="font-size:24px; margin-bottom:14px;">'+esc(cfg.title)+'</h1>' +
      (cfg.extraHtml ? '<div class="card tint-sage extra-card">'+cfg.extraHtml+'</div>' : '') +
      imgHtml +
      stepsHtml +
      (cfg.evidence ? '<div class="ev-line">Evidence: '+esc(cfg.evidence)+'</div>' : '') +
      (cfg.safety ? '<div class="card tint-red" style="margin-top:12px; font-size:12px; color:var(--cream); line-height:1.6;"><b style="color:var(--red);">Safety: </b>'+cfg.safety+'</div>' : '') +
      (cfg.stopwatch ? '<div data-timer></div>' : '') +
      (cfg.tipLabel ? '<div class="tip-hint">'+esc(cfg.tipLabel)+'</div>' : '') +
    '</div>' +
    '<div class="screen-foot">' +
      '<button class="btn btn-primary" data-act="continue">'+esc(cfg.continueLabel||'Done, next →')+'</button>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    var contBtn = $(el,'[data-act=continue]');
    var stopwatchApi = null;
    if (cfg.stopwatch){
      // Non-blocking on purpose: the timer is a pacing aid, not a gate.
      var swSlot = $(el,'[data-timer]');
      stopwatchApi = mountStopwatch(swSlot, { color: cfg.color, pulse: !!cfg.pulse });
      state.cleanups.push(stopwatchApi.cleanup);
    }
    contBtn.addEventListener('click', function(){
      if (stopwatchApi && cfg.onStopwatchElapsed) cfg.onStopwatchElapsed(stopwatchApi.getElapsed());
      cfg.onContinue();
    });
  }
  return { el:el, mount:mount };
}

      '<button class="btn btn-sage" data-act="continue">None of these. Continue →</button>' +

function renderColicType(){
  var order = ['GUT','NS','FM'];
  var fromQuiz = state.colicTypeFromQuiz && TYPE_MAP[state.colicType];
  var conf = state.colicTypeConfidence;
  var lowConfidence = fromQuiz && conf !== null && conf < 60;
  var cardsHtml = order.map(function(code){
    var t = TYPE_MAP[code];
    var pre = fromQuiz && state.colicType === code;
    var preTag = pre
      ? (lowConfidence
          ? ' <b style="color:var(--gold);">leaning this way, from your assessment</b>'
          : ' <b style="color:var(--sage);">✓ from your assessment</b>')
      : '';
    return '<button class="opt '+(pre?'opt-good':'')+'" data-type="'+code+'" style="'+(pre?'':'border-color:var(--border-strong); background:none;')+'">' +
      '<span style="font-size:18px;">'+t.emoji+'</span>' +
      '<span>'+t.label+preTag+'</span>' +
    '</button>';
  }).join('');
  var headline = !fromQuiz
    ? 'Already know where\nyou want to start?'
    : (lowConfidence ? 'Your answers leaned\ntoward one pattern.' : 'We’ll point out the steps\nthat match your result.');
  var subText = !fromQuiz
    ? 'If you’ve taken the free assessment, tell us. We’ll point out the steps that match your baby’s starting point.'
    : (lowConfidence
        ? 'It wasn’t a clear-cut result, your answers touched more than one pattern. This is our best read, a starting point and not a diagnosis. Keep it if it fits tonight, or switch if it doesn’t.'
        : 'Your assessment pointed to one starting pattern. Keep it, or pick a different one if tonight feels different.');
  var html =
    '<div class="screen-body">' +
      '<div class="eyebrow" style="color:var(--terra)">Optional · 5 seconds</div>' +
      '<h1 class="h1" style="font-size:23px; white-space:pre-line;">' + headline + '</h1>' +
      '<p class="sub">' + subText + '</p>' +
      '<div style="margin-top:14px;">' + cardsHtml +
        '<button class="opt" data-type="UNSURE" style="border-color:var(--border-strong); background:none;"><span style="font-size:16px;">•</span><span>Not sure, just help me now</span></button>' +
      '</div>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    $all(el, '[data-type]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var code = btn.getAttribute('data-type');
        state.colicType = code === 'UNSURE' ? '' : code;
        if (code === 'UNSURE') state.colicTypeFromQuiz = false;
        markStage('colic_type');
        goTo('environment');
      });
    });
  }
  return { el:el, mount:mount };
}

function renderEnvironment(){
  state.environmentStartedAt = Date.now();
  var items = [
    ['lights','Lights dimmed','Low and warm is fine',
      'A calm, dim room means less for your baby to react to. No trial shows a particular light level helps colic, so treat this as common-sense comfort, not a proven step. Keep enough light to see your baby safely.'],
    ['noise','Low, steady sound (optional)','Quiet, across the room, on a timer',
      'Steady low sound is common practice and some babies seem to settle with it. It has not been shown to reduce colic. Baby sound machines have also been measured above recommended levels at full volume (Hugh et al., Pediatrics 2014), so keep it quiet, across the room, never beside the crib, and set a timer.'],
    ['screens','Screens off','TV, tablets, phones turned away',
      'A lit screen nearby adds light and movement when you are trying to reduce what your baby has to take in. This is common sense, not trial-tested. It includes your own phone if it is propped up and lit.'],
    ['temp','Room feels comfortable','Not too warm',
      'Overheating is a safe-sleep concern, and many safe-sleep guides suggest roughly 16 to 20°C (61 to 68°F). If you would be comfortable in a light long-sleeve layer, the room is likely in range.']
  ];
  var rowsHtml = items.map(function(it, i){
    return '<div class="toggle-row" data-env="'+it[0]+'">' +
      '<div class="toggle-box">'+ICONS.check+'</div>' +
      '<div class="toggle-text">' +
        '<b>'+it[1]+'</b><span>'+it[2]+'</span>' +
        '<button type="button" class="why-btn" data-whytoggle data-idx="'+i+'">Why this helps ▾</button>' +
        '<div class="why-body" data-whybody data-idx="'+i+'" hidden>'+it[3]+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
  var html =
    '<div class="screen-body">' +
      '<div class="dots">' + dotsHTML(2) + '</div>' +
      '<div class="eyebrow" style="color:var(--sage)">Stage 2 · Calm the Room</div>' +
      typeBadgeHtml('NS','A good place to start for your result') +
      '<h1 class="h1" style="font-size:25px;">Calm the room<br>first.</h1>' +
      '<p class="sub">Fewer inputs can make it easier to settle a baby. This is common sense rather than a proven step, so keep it simple. Tap any item for the reasoning.</p>' +
      '<div class="illus" style="margin-top:14px;">' + SVGS.environment + '</div>' +
      '<div class="card" style="margin-top:16px;">' + rowsHtml + '</div>' +
      '<div class="ev-line" style="margin-top:8px;">Evidence: common practice, not trial-tested for colic</div>' +
      '<div class="progress-track"><div class="progress-fill" data-fill style="width:0%;"></div></div>' +
      '<div class="solidarity-note">' + ICONS.shield +
        '<span>You’re not the only parent standing in a dim room doing exactly this right now. Colic is hard, and it is not a sign you are doing anything wrong.</span>' +
      '</div>' +
    '</div>' +
    '<div class="screen-foot">' +
      '<button class="btn btn-sage" data-act="continue" disabled>Continue →</button>' +
      '<div class="skiplink"><button class="btn-link" data-act="skip">Skip for now, every minute counts</button></div>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    var fill = $(el,'[data-fill]'), cont = $(el,'[data-act=continue]');
    function update(){
      var on = $all(el,'.toggle-row.on').length;
      fill.style.width = Math.round((on/items.length)*100) + '%';
      cont.disabled = on < items.length;
    }
    $all(el, '.toggle-row').forEach(function(row){
      row.addEventListener('click', function(e){
        if (e.target.closest('[data-whytoggle]')) return;
        row.classList.toggle('on'); update();
      });
    });
    $all(el, '[data-whytoggle]').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var idx = btn.getAttribute('data-idx');
        var body = $(el, '[data-whybody][data-idx="'+idx+'"]');
        var wasHidden = body.hasAttribute('hidden');
        if (wasHidden) body.removeAttribute('hidden'); else body.setAttribute('hidden','');
        btn.textContent = wasHidden ? 'Why this helps ▴' : 'Why this helps ▾';
      });
    });
    cont.addEventListener('click', function(){ goTo('environmentCheck'); });
    $(el,'[data-act=skip]').addEventListener('click', function(){ goTo('environmentCheck'); });
  }
  return { el:el, mount:mount };
}

    stageDots:4, eyebrow:'Stage 4 · Belly Comfort', color:'var(--blush)',
    stepbar:{current:2,total:4},
    title:'Tummy Massage (I-L-U)',
    svg: '<img src="'+IMG['abdominal_massage_pathway_diagram']+'" onerror="__mpFallback(this,\'ilu\')" alt="I-L-U abdominal massage pathway diagram" style="width:100%; height:auto; display:block; border-radius:var(--r-md);">',
    steps:[
      'Use a flat hand with firm but gentle pressure. Always clockwise along the path shown.',
      '<b style="color:var(--terra);">“I” stroke:</b> down your baby’s left side.',
      '<b style="color:var(--gold);">“L” stroke:</b> across the top, then down the left side.',
      '<b style="color:var(--sage);">“U” stroke:</b> up the right side, across the top, down the left side.'
    ],
    evidence:'Small, unblinded studies suggest massage may reduce distress for some babies',
    tipLabel:'Repeat the full sequence 2 or 3 times. Stop if your baby resists.',
    continueLabel:'Done, next: football hold →',
    onContinue:function(){ goTo('footballHold'); }
  });
}

function renderFootballHold(){
  return buildTechniqueScreen({
    stageDots:4, eyebrow:'Stage 4 · Belly Comfort', color:'var(--blush)',
    stepbar:{current:3,total:4},
    title:'Football Hold',
    svg: '<img src="'+IMG['football_hold']+'" onerror="__mpFallback(this,\'football\')" alt="Football hold" style="width:100%; height:auto; display:block; border-radius:var(--r-md);">',
    steps:[
      'Tuck your baby along your forearm, facing you, body upright and supported.',
      'Support the head in your palm. Ear, shoulder, and hip in one line.',
      'Keep your baby upright and well supported, and pause to burp gently every minute or so.'
    ],
    evidence:'Common practice, not trial-tested',
    tipLabel:'Keep your baby upright and supported. Stop if they resist.',
    continueLabel:'Done, next: warm compress →',
    onContinue:function(){ goTo('warmCompress'); }
  });
}

function renderWarmCompress(){
  return buildTechniqueScreen({
    stageDots:4, eyebrow:'Stage 4 · Belly Comfort', color:'var(--blush)',
    stepbar:{current:4,total:4},
    title:'Warm Compress',
    svg: ICONS.compress,
    steps:[
      'Warm a damp cloth, then test it on the inside of your own wrist first. Warm, not hot.',
      'Lay it gently across your baby’s belly.',
      'Keep your baby upright or semi-upright while it sits, and continue any soothing already running.'
    ],
    evidence:'Common comfort measure, not trial-tested',
    safety:'Never leave a compress unattended. Remove it immediately if skin looks red or your baby resists it.',
    tipLabel:'No rush. Keep your baby upright or semi-upright while it sits.',
    continueLabel:'Done, how’s baby now? →',
    onContinue:function(){ goTo('finalCheck'); }
  });
}

function renderFinalCheck(){
  state.finalStartedAt = Date.now();
  var gasReleaseSeconds = state.gas_releaseStartedAt
    ? Math.round((Date.now() - state.gas_releaseStartedAt) / 1000)
    : null;
  state.gas_releaseStartedAt = null;
  return buildOutcomeScreen({
    eyebrowColor:'var(--terra)',
    title:'After everything tonight…',
    sub:'Where’s baby right now?',
    onPick:function(val){
      state.outcomes.final = val;
      var extra = {};
      if (gasReleaseSeconds !== null) extra.gas_release_dwell_seconds = gasReleaseSeconds;
      submitOutcome('final', val, extra);
      submitCompleted();
      goTo('bridge');
    }
  });
}

var BRIDGE_COPY = {
  good: { h:'Baby’s settled. Here’s what could make\nthe next few weeks less chaotic.',
    sub:'Tonight went well. Colic often comes back in the evening, and it usually peaks around week 6 and eases by about 3 to 4 months. A clear order to try things in, plus a log, can help you see what is working.' },
  mid: { h:'Better, but not all the\nway there yet.',
    sub:'That’s common, and no technique works every time. Trying one change at a time and keeping a log can help you see what is helping.' },
  low: { h:'You showed up for every step tonight.\nThat took real effort.',
    sub:'No technique works every time, and colic often eases on its own. If tonight was rough, run through the warning signs again, and talk to your pediatrician if you are worried.' }
};

function sysCardHtml(sys, matched){
  var matchTag = matched ? '<span class="pill badge-clear" style="margin-left:8px;">✓ Your starting point</span>' : '';
  var faded = (state.colicType && !matched) ? 'opacity:.55;' : '';
  return '<div class="sys-card tint-'+sys.tint+'" style="background:var(--card); border-color:'+(matched?'var(--'+sys.tint+'-line)':'var(--border)')+'; '+(matched?'box-shadow:0 0 20px rgba(224,189,117,0.15);':'')+faded+'">' +
    '<div class="ic" style="background:var(--'+sys.tint+'-soft); color:var(--'+sys.tint+');">'+sys.icon+'</div>' +
    '<div><b style="color:var(--cream); display:flex; align-items:center; flex-wrap:wrap; gap:2px;">'+sys.name+matchTag+'</b><p>'+sys.signs+'</p></div>' +
  '</div>';
}

function renderBridge(){
  var copy = BRIDGE_COPY[state.outcomes.final || 'mid'];
  var refId = encodeURIComponent(state.quizAssessmentId || ASSESSMENT_ID);

  // Checkout: straight to Gumroad (skips the Gumroad product page).
  var blueprintHref = withUTM(CONFIG.BLUEPRINT_URL, 'post_crisis_offer');
  blueprintHref += (blueprintHref.indexOf('?') > -1 ? '&' : '?') + 'ref=' + refId + '&wanted=true';

  // View product: the /blueprint page, with the same ref so it carries through.
  var viewHref = withUTM(CONFIG.VIEW_PRODUCT_URL, 'post_crisis_offer_view');
  viewHref += (viewHref.indexOf('?') > -1 ? '&' : '?') + 'ref=' + refId;

  var quizHref = withUTM(CONFIG.QUIZ_URL, 'starting_point_bridge');

  var known = state.colicType && SYSTEMS.filter(function(s){ return s.code === state.colicType; })[0];
  var orderedSystems = known ? [known].concat(SYSTEMS.filter(function(s){ return s.code !== state.colicType; })) : SYSTEMS;

  var introHtml = known
    ? ('<p class="sub">'+esc(copy.sub)+' Your starting point was <b style="color:var(--cream);">'+known.name+'</b>. That is a best guess, not a diagnosis. These are the three practical starting patterns.</p>')
    : ('<p class="sub">'+esc(copy.sub)+' Colic has no single known cause. These are three practical places to start.</p>');

  var quizNote = known
    ? 'A starting point, not a diagnosis. Your baby can show signs of more than one pattern.'
    : 'A free 90-second assessment can suggest where to start.';

  var html =
    '<div class="screen-body">' +
      '<div class="eyebrow" style="color:var(--terra)">A starting point for the weeks ahead</div>' +
      '<h1 class="h1" style="font-size:24px; white-space:pre-line;">'+esc(copy.h)+'</h1>' +
      introHtml +

      orderedSystems.map(function(s){ return sysCardHtml(s, known && s.code === state.colicType); }).join('') +

      '<div class="timer-note" style="margin:8px auto 0;">'+quizNote+'</div>' +

      '<div class="divider"></div>' +
      '<div class="label-sm center-text" style="margin-bottom:10px;">If you want the steps, tracker and evidence in one place</div>' +
      '<div class="card">' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Starting-point assessment, a deeper version of the free one</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Step-by-step guide for each pattern, with the evidence stated</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Bloom Baby Tracker App</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'60-Minute Brown Noise Soundscape</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Cry Decoder Masterclass</div></div>' +
        '<div class="vs-total"><span class="lbl">The Calm Baby Blueprint</span><span class="amt">$47</span></div>' +
      '</div>' +
      '<div class="card tint-sage" style="margin-top:12px;">' +
        '<div style="display:flex; gap:12px; align-items:flex-start;"><div style="color:var(--sage); flex-shrink:0; margin-top:2px;">'+ICONS.shield+'</div>' +
        '<p style="margin:0; font-size:12.5px; color:var(--cream); line-height:1.6;"><b style="color:var(--sage);">72-Hour Guarantee.</b> If it doesn’t produce a meaningful shift in 72 hours, reply and I’ll make it right. You keep the Blueprint either way. The 72 hours covers the first changes, like feeding, positioning and soothing. It is not a promise about any single product.</p></div>' +
      '</div>' +
      '<div class="illus" style="margin-top:16px; background:none; border:none; box-shadow:none; padding:0;"><img src="'+IMG['bundle']+'" alt="The Calm Baby Blueprint bundle" style="width:100%; height:auto; display:block; border-radius:var(--r-md);"></div>' +
    '</div>' +
    '<div class="screen-foot">' +
      '<a class="btn btn-primary" href="'+blueprintHref+'" target="_blank" rel="noopener">Get the Calm Baby Blueprint, $47 →</a>' +
      '<div class="timer-note" style="margin:6px auto 10px;">72-Hour Guarantee. Keep it either way.</div>' +
      '<a class="btn btn-outline" href="'+viewHref+'" target="_blank" rel="noopener">View the full product page</a>' +
      (known ? '' : '<div class="skiplink"><a class="btn-link" href="'+quizHref+'" style="text-decoration:underline;">Take the free assessment first</a></div>') +
      '<div class="skiplink"><button class="btn-link" data-act="restart">↺ Run the protocol again</button></div>' +
      '<div class="trust-line">' + DISCLAIMER + '</div>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    $(el,'[data-act=restart]').addEventListener('click', function(){
      state.outcomes = { environment:null, tigerHold:null, final:null };
      goTo('stopscan');
    });
  }
  return { el:el, mount:mount };
}

var SCREENS = {
  welcome: renderWelcome,
  stopscan: renderStopScan,
  colicType: renderColicType,
  emergency: renderEmergency,
  environment: renderEnvironment,
  environmentCheck: renderEnvironmentCheck,
  breathing: renderBreathing,
  tigerHold: renderTigerHold,
  tigerHoldCheck: renderTigerHoldCheck,
  tigerHoldTroubleshoot: renderTigerHoldTroubleshoot,
  bicycleLegs: renderBicycleLegs,
  iluMassage: renderIluMassage,
  footballHold: renderFootballHold,
  warmCompress: renderWarmCompress,
  finalCheck: renderFinalCheck,
  bridge: renderBridge
};

root = document.getElementById('app');
render();

})();
</script>
</body>
</html>
