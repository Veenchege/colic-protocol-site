<title>The Midnight Protocol · Colic Protocol</title>
<meta name="description" content="A step-by-step evidence-based protocol for colic crisis moments. Visual holds, rhythmic metronome, and pediatric soothing sequence.">

<style>
:root{
  --bg:#100d0a; --bg-soft:#15100c; --card:rgba(31,25,16,0.78); --card-2:rgba(37,29,20,0.85);
  --border:rgba(244,237,228,0.11); --border-strong:rgba(244,237,228,0.22);
  --cream:#f5efe6; --muted:#ab9c8b; --muted-2:#756652;
  --terra:#dd8058; --terra-soft:rgba(221,128,88,0.16); --terra-line:rgba(221,128,88,0.48); --terra-deep:#c4603a;
  --sage:#93b394; --sage-soft:rgba(147,179,148,0.16); --sage-line:rgba(147,179,148,0.48);
  --gold:#e0bd75; --gold-soft:rgba(224,189,117,0.16); --gold-line:rgba(224,189,117,0.48);
  --blush:#e6a189; --blush-soft:rgba(230,161,137,0.16); --blush-line:rgba(230,161,137,0.48);
  --red:#e2685c; --red-soft:rgba(226,104,92,0.16); --red-line:rgba(226,104,92,0.55);
  --green:#8fbf9a;
  --shadow:0 24px 70px rgba(0,0,0,0.65);
  --shadow-glow:0 0 35px rgba(224,189,117,0.12);
  --r-lg:24px; --r-md:16px; --r-sm:11px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 720px 520px at 12% 6%, rgba(221,128,88,0.18), transparent 60%),
    radial-gradient(ellipse 640px 520px at 88% 94%, rgba(147,179,148,0.15), transparent 60%),
    radial-gradient(ellipse 900px 800px at 50% 45%, rgba(224,189,117,0.065), transparent 70%),
    #080604;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--sans); color:var(--cream);
  padding:22px 12px; -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;}
button{-webkit-tap-highlight-color:transparent;}
::selection{background:var(--terra-soft); color:var(--cream);}

.phone{
  width:100%; max-width:446px; min-height:min(890px,95vh);
  background:linear-gradient(180deg, #16120d 0%, #100d0a 100%);
  border-radius:36px; border:1px solid var(--border-strong);
  box-shadow:var(--shadow), 0 0 40px rgba(221,128,88,0.08);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
}
.phone::before{
  content:''; position:absolute; top:-120px; left:50%; transform:translateX(-50%);
  width:360px; height:280px; border-radius:50%;
  background:radial-gradient(ellipse, rgba(224,189,117,0.18), transparent 68%);
  pointer-events:none; z-index:0;
}
#app{position:relative; z-index:1; flex:1; display:flex; flex-direction:column;}

@media (max-width:480px){
  body{padding:0;}
  .phone{max-width:100%; min-height:100vh; border-radius:0; border:none; box-shadow:none;}
  .phone::before{display:none;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
}

/* ── layout ─────────────────────────────────────────────── */
.screen{display:flex; flex-direction:column; flex:1; padding:28px 22px 24px; animation:screenIn .38s cubic-bezier(.16,1,.3,1);}
.screen.center{justify-content:center;}
.screen-body{flex:1; display:flex; flex-direction:column;}
.screen-foot{margin-top:16px;}
@keyframes screenIn{from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;}}

.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.17em; text-transform:uppercase; margin-bottom:11px; display:flex; align-items:center; gap:9px; font-weight:500;}
.eyebrow::before{content:''; width:18px; height:1px; background:currentColor; opacity:.65;}

.h1{font-family:var(--serif); font-size:28px; font-weight:700; line-height:1.15; margin:0 0 10px; color:var(--cream); letter-spacing:-.01em;}
.h1 i{font-style:italic; color:var(--terra); font-weight:600;}
.h2{font-family:var(--serif); font-size:22px; font-weight:700; line-height:1.2; margin:0 0 8px;}
.sub{color:var(--muted); font-size:14px; line-height:1.65; margin-bottom:4px;}
.center-text{text-align:center;}

.dots{display:flex; gap:8px; justify-content:center; margin-bottom:20px;}
.dot{height:6px; border-radius:4px; background:rgba(244,237,228,0.18); transition:all .35s ease; width:6px;}
.dot.active{width:24px; background:var(--gold); box-shadow:0 0 10px rgba(224,189,117,0.5);}
.dot.done{background:var(--sage); opacity:.85;}

.stepbar{display:flex; gap:5px; margin-bottom:18px;}
.stepbar i{flex:1; height:3.5px; border-radius:2px; background:rgba(244,237,228,0.14); font-style:normal; transition:background .3s ease;}
.stepbar i.on{background:currentColor; box-shadow:0 0 8px currentColor;}
.stepbar i.past{background:currentColor; opacity:.45;}

.btn{width:100%; min-height:54px; border-radius:15px; border:none; font-weight:700; font-size:15.5px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, filter .15s ease, opacity .15s ease, box-shadow .2s ease; letter-spacing:.005em;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,#e8935f,var(--terra-deep)); color:#190b04; box-shadow:0 10px 28px rgba(221,128,88,.32);}
.btn-primary:hover{filter:brightness(1.06); box-shadow:0 12px 32px rgba(221,128,88,.42);}
.btn-sage{background:linear-gradient(135deg,#a8c9a8,#6f9373); color:#0c170e; box-shadow:0 10px 28px rgba(147,179,148,.26);}
.btn-sage:hover{filter:brightness(1.06);}
.btn-ghost{background:rgba(244,237,228,.05); color:var(--cream); border:1px solid var(--border-strong);}
.btn-outline{background:rgba(221,128,88,0.04); border:1.5px solid var(--terra-line); color:var(--terra); box-shadow:none;}
.btn-outline:hover{background:var(--terra-soft); border-color:var(--terra);}
.btn-outline.sage{border-color:var(--sage-line); color:var(--sage); background:rgba(147,179,148,0.04);}
.btn-link{background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:8px;}
.btn:disabled{opacity:.35; cursor:not-allowed; filter:grayscale(.35); box-shadow:none;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}
a.btn{text-decoration:none;}
.field:focus-visible,.btn:focus-visible,.toggle-row:focus-visible,.opt:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.card{
  background:var(--card);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:18px 17px;
  box-shadow:0 8px 30px rgba(0,0,0,0.35);
  transition:border-color .2s ease, box-shadow .2s ease;
}
.card.tint-terra{background:linear-gradient(180deg, rgba(221,128,88,.12), rgba(221,128,88,.04)); border-color:var(--terra-line); box-shadow:0 8px 30px rgba(221,128,88,0.1);}
.card.tint-sage{background:linear-gradient(180deg, rgba(147,179,148,.12), rgba(147,179,148,.04)); border-color:var(--sage-line); box-shadow:0 8px 30px rgba(147,179,148,0.08);}
.card.tint-gold{background:linear-gradient(180deg, rgba(224,189,117,.12), rgba(224,189,117,.04)); border-color:var(--gold-line); box-shadow:0 8px 30px rgba(224,189,117,0.08);}
.card.tint-blush{background:linear-gradient(180deg, rgba(230,161,137,.12), rgba(230,161,137,.04)); border-color:var(--blush-line);}
.card.tint-red{background:linear-gradient(180deg, rgba(226,104,92,.14), rgba(226,104,92,.05)); border-color:var(--red-line); box-shadow:0 8px 30px rgba(226,104,92,0.12);}
.card + .card{margin-top:12px;}

.field-group{margin-bottom:13px;}
.field{width:100%; min-height:52px; background:var(--card-2); border:1px solid var(--border-strong);
  border-radius:13px; color:var(--cream); font-size:16px; padding:0 16px; outline:none;
  -webkit-appearance:none; appearance:none; transition:border-color .2s, box-shadow .2s;}
.field:focus{border-color:var(--gold); box-shadow:0 0 12px rgba(224,189,117,0.25);}
.field::placeholder{color:var(--muted-2);}
.field.invalid{border-color:var(--red-line);}
.err{color:var(--red); font-size:11.5px; margin-top:6px; line-height:1.5;}
.label-sm{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted-2); margin-bottom:7px; display:block;}
.consent-row{display:flex; gap:11px; align-items:flex-start; margin-top:14px; cursor:pointer;}
.consent-row input[type=checkbox]{margin-top:3px; width:17px; height:17px; flex-shrink:0; accent-color:var(--terra);}
.consent-row span{color:var(--muted); font-size:12px; line-height:1.6;}

.toggle-row{display:flex; align-items:center; gap:13px; padding:13px 4px; cursor:pointer; user-select:none; border-radius:10px; transition:background .2s ease;}
.toggle-row:hover{background:rgba(244,237,228,0.03);}
.toggle-row + .toggle-row{border-top:1px solid var(--border);}
.toggle-box{width:25px; height:25px; border-radius:8px; border:1.5px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .25s ease; background:var(--card-2);}
.toggle-row.on .toggle-box{background:var(--sage); border-color:var(--sage); box-shadow:0 0 12px rgba(147,179,148,0.5);}
.toggle-box svg{width:14px; height:14px; opacity:0; transition:opacity .15s;}
.toggle-box svg path{stroke-dasharray:24; stroke-dashoffset:24; transition:stroke-dashoffset .3s ease;}
.toggle-row.on .toggle-box svg{opacity:1;}
.toggle-row.on .toggle-box svg path{stroke-dashoffset:0;}
.toggle-text b{display:block; font-size:14px; font-weight:600; color:var(--cream); margin-bottom:1px;}
.toggle-text span{font-size:12px; color:var(--muted);}
.progress-track{height:4px; background:var(--border); border-radius:3px; overflow:hidden; margin:16px 0 4px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--sage),#b3d0b3); border-radius:3px; transition:width .4s ease; box-shadow:0 0 8px rgba(147,179,148,0.6);}

.danger-item{display:flex; align-items:center; gap:13px; padding:14px 4px; cursor:pointer; border-radius:10px; transition:background .15s;}
.danger-item:hover{background:rgba(226,104,92,0.08);}
.danger-item + .danger-item{border-top:1px solid var(--border);}
.danger-check{width:25px; height:25px; border-radius:50%; border:1.5px solid var(--red-line);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .2s;}
.danger-item.on .danger-check{background:var(--red); box-shadow:0 0 12px rgba(226,104,92,0.6);}
.danger-check svg{width:13px; height:13px; opacity:0;}
.danger-check svg path{stroke-dasharray:20; stroke-dashoffset:20; transition:stroke-dashoffset .25s ease;}
.danger-item.on .danger-check svg{opacity:1;}
.danger-item.on .danger-check svg path{stroke-dashoffset:0;}
.danger-item b{font-size:14px; font-weight:600; line-height:1.4;}

.opt{width:100%; min-height:60px; border-radius:15px; text-align:left; padding:0 18px;
  display:flex; align-items:center; gap:13px; font-weight:600; font-size:14.5px;
  border:1px solid; cursor:pointer; margin-bottom:10px; background:none; color:var(--cream); transition:transform .12s, box-shadow .2s, border-color .2s;}
.opt:active{transform:scale(.98);}
.opt:last-child{margin-bottom:0;}
.opt .dot-ind{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.opt-good{border-color:var(--sage-line); background:var(--sage-soft);}
.opt-good:hover{box-shadow:0 0 18px rgba(147,179,148,0.25);}
.opt-good .dot-ind{background:var(--sage); box-shadow:0 0 8px var(--sage);}
.opt-mid{border-color:var(--gold-line); background:var(--gold-soft);}
.opt-mid:hover{box-shadow:0 0 18px rgba(224,189,117,0.25);}
.opt-mid .dot-ind{background:var(--gold); box-shadow:0 0 8px var(--gold);}
.opt-low{border-color:var(--red-line); background:var(--red-soft);}
.opt-low:hover{box-shadow:0 0 18px rgba(226,104,92,0.25);}
.opt-low .dot-ind{background:var(--red); box-shadow:0 0 8px var(--red);}

.illus{width:100%; border-radius:18px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border); background:#0c0906; position:relative; box-shadow:inset 0 0 30px rgba(0,0,0,0.5);}
.illus svg{width:100%; height:auto; display:block;}

.steps-list{list-style:none; margin:0 0 6px; padding:0; counter-reset:step;}
.steps-list li{counter-increment:step; display:flex; gap:12px; padding:9px 0; font-size:13.5px; line-height:1.6; color:var(--cream);}
.steps-list li::before{content:counter(step); font-family:var(--mono); font-size:11px; font-weight:600;
  width:22px; height:22px; border-radius:50%; background:var(--card-2); border:1px solid var(--border-strong);
  color:var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}

.timer-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; margin:14px 0 6px; position:relative;}
.timer-ring{position:relative; width:134px; height:134px;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-digits{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column;}
.timer-digits .t{font-family:var(--mono); font-size:24px; font-weight:600; color:var(--cream);}
.timer-digits .p{width:10px; height:10px; border-radius:50%; margin-top:6px; animation:pulse60 1s ease-in-out infinite;}

@keyframes pulse60{
  0%,100%{transform:scale(1); opacity:.4; filter:drop-shadow(0 0 2px currentColor);}
  50%{transform:scale(1.45); opacity:1; filter:drop-shadow(0 0 10px currentColor);}
}
@keyframes metronomeGlow{
  0%,100%{box-shadow:0 0 0 0 rgba(221,128,88,0); transform:scale(1);}
  50%{box-shadow:0 0 28px 8px rgba(221,128,88,0.28); transform:scale(1.02);}
}
.metro-active .timer-ring{border-radius:50%; animation:metronomeGlow 1s ease-in-out infinite;}

.timer-controls{display:flex; gap:8px;}
.timer-btn{min-height:44px; padding:0 20px; border-radius:12px; font-size:13.5px; font-weight:600; cursor:pointer; border:1px solid var(--border-strong); background:rgba(244,237,228,.06); color:var(--cream); transition:all .2s;}
.timer-btn:hover{background:rgba(244,237,228,.12); border-color:var(--gold);}
.timer-note{font-size:11.5px; color:var(--muted-2); text-align:center; max-width:260px; line-height:1.5;}
.timer-done-note{font-size:12px; color:var(--sage); font-weight:600; text-align:center;}

.metro-badge{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px;
  letter-spacing:.09em; text-transform:uppercase; color:var(--terra); background:var(--terra-soft);
  border:1px solid var(--terra-line); padding:4px 10px; border-radius:14px; margin-top:4px;
}
.metro-dot{width:6px; height:6px; border-radius:50%; background:var(--terra); animation:pulse60 1s ease-in-out infinite;}

.orb-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 0;}
.orb{border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all .8s cubic-bezier(.45,0,.55,1); border:2px solid; box-shadow:0 0 30px rgba(224,189,117,0.18);}
.orb .n{font-family:var(--serif); font-weight:700;}

.vs-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 0;}
.vs-row + .vs-row{border-top:1px solid var(--border);}
.vs-row .nm{display:flex; gap:9px; align-items:flex-start; font-size:13px; color:var(--cream); line-height:1.5;}
.vs-row .nm svg{flex-shrink:0; margin-top:2px; width:15px; height:15px; color:var(--sage);}
.vs-row .val{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap;}
.vs-total{display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding:14px 16px;
  background:linear-gradient(135deg, rgba(147,179,148,0.18), rgba(147,179,148,0.06));
  border:1.5px solid var(--sage-line); border-radius:14px; box-shadow:0 0 25px rgba(147,179,148,0.15);}
.vs-total .lbl{font-size:14px; font-weight:700; color:var(--cream);}
.vs-total .amt{font-family:var(--serif); font-size:25px; font-weight:700; color:var(--sage);}

.sys-card{display:flex; gap:13px; padding:15px; border-radius:15px; border:1px solid var(--border); margin-bottom:11px; align-items:flex-start; transition:all .2s;}
.sys-card .ic{width:40px; height:40px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.sys-card .ic svg{width:20px; height:20px;}
.sys-card b{display:block; font-size:14px; margin-bottom:3px;}
.sys-card p{margin:0; font-size:12px; color:var(--muted); line-height:1.55;}

.expand{border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--card); backdrop-filter:blur(10px);}
.expand summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:600; color:var(--cream);}
.expand summary::-webkit-details-marker{display:none;}
.expand summary .chev{transition:transform .2s; color:var(--muted); flex-shrink:0;}
.expand[open] summary .chev{transform:rotate(180deg);}
.expand .expand-body{padding:0 16px 16px;}
.expand .expand-body svg{width:100%; border-radius:12px; display:block;}

.ilu-track{transition:stroke .4s, stroke-width .4s, filter .4s, opacity .4s;}
.ilu-active{stroke:var(--gold) !important; stroke-width:5 !important; opacity:1 !important; filter:drop-shadow(0 0 10px rgba(224,189,117,0.9));}
.ilu-label-slot{min-height:22px; font-size:12.5px; font-weight:600; color:var(--gold); text-align:center; margin-top:6px;}

.spacer{flex:1;}
.trust-line{display:flex; gap:9px; align-items:center; font-size:11.5px; color:var(--muted-2); margin-top:16px; justify-content:center; text-align:center; line-height:1.5;}
.divider{height:1px; background:var(--border); margin:18px 0;}
.big-num{font-family:var(--serif); font-weight:800; letter-spacing:.02em;}
.pill{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:5px 11px; border-radius:20px; border:1px solid;}
.badge-clear{color:var(--sage); border-color:var(--sage-line); background:var(--sage-soft);}
.skiplink{text-align:center; margin-top:10px;}
</style>
</head>
<body>
<div class="phone"><div id="app"></div></div>
<script>
(function(){

      checklist_version: '1.2-vector',
      purchase_status: 'pending'
    }, state.utm, extra || {});
    fetch(CONFIG.ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      keepalive:true,
      body: JSON.stringify(body)
    })['catch'](function(){});
  }catch(e){}
}
function submitLead(){
  var isBot = (Date.now() - SESSION_STARTED_AT) < 1500;
  if (isBot) return;
  post({ checklist_status:'started', checklist_last_stage:'welcome' });
}
function markStage(stageName, extra){
  if (!state.lead.email) return;
  post(Object.assign({ checklist_status:'in_progress', checklist_last_stage: stageName }, extra || {}));
}
function submitOutcome(stage, result){
  if (!state.lead.email) return;
  var extra = { checklist_status:'in_progress', checklist_last_stage: stage };
  extra[stage + '_outcome'] = result;
  post(extra);
}
function submitCompleted(){
  if (!state.lead.email) return;
  post({ checklist_status:'completed', checklist_last_stage:'bridge' });
}

function mountTimer(container, opts){
  var seconds = opts.seconds, color = opts.color || 'var(--terra)',
      pulse = !!opts.pulse, onDone = opts.onDone || function(){}, label = opts.label;
  var rem = seconds, live = false, done = false, interval = null;
  var R = 52, C = 2*Math.PI*R;

  var wrap = document.createElement('div');
  wrap.className = 'timer-wrap' + (pulse ? ' metro-active' : '');
  wrap.innerHTML =
    '<div class="timer-ring">' +
      '<svg width="134" height="134" viewBox="0 0 134 134">' +
        '<circle cx="67" cy="67" r="'+R+'" fill="none" stroke="rgba(244,237,228,0.12)" stroke-width="6"/>' +
        '<circle class="ring-fg" cx="67" cy="67" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="6" ' +
          'stroke-dasharray="'+C+'" stroke-dashoffset="0" stroke-linecap="round"/>' +
      '</svg>' +
      '<div class="timer-digits"><span class="t"></span>'+(pulse?'<span class="p" style="background:'+color+';color:'+color+'"></span>':'')+'</div>' +
    '</div>' +
    (pulse ? '<div class="metro-badge"><span class="metro-dot"></span>60 BPM Rhythm Pulse</div>' : '') +
    '<div class="timer-controls"></div>' +
    '<div class="timer-note-slot"></div>';
  container.appendChild(wrap);

  var ringFg = wrap.querySelector('.ring-fg');
  var digitEl = wrap.querySelector('.t');
  var controls = wrap.querySelector('.timer-controls');
  var noteSlot = wrap.querySelector('.timer-note-slot');

  function fmt(s){ var m = Math.floor(s/60), ss = s%60; return m + ':' + (ss<10?'0':'') + ss; }
  
  function updateIluGraphic(){
    var trackI = document.getElementById('ilu-track-i');
    var trackL = document.getElementById('ilu-track-l');
    var trackU = document.getElementById('ilu-track-u');
    var statusText = document.getElementById('ilu-status-text');
    if (!trackI || !trackL || !trackU) return;

    trackI.classList.remove('ilu-active');
    trackL.classList.remove('ilu-active');
    trackU.classList.remove('ilu-active');

    if (!live && rem === seconds){
      if (statusText) statusText.textContent = 'READY TO START CLOCKWISE MASSAGE';
      return;
    }

    if (rem > 45){
      trackI.classList.add('ilu-active');
      if (statusText) statusText.textContent = 'PHASE 1: "I" STROKE (DOWN BABY\'S LEFT)';
    } else if (rem > 25){
      trackL.classList.add('ilu-active');
      if (statusText) statusText.textContent = 'PHASE 2: "L" STROKE (ACROSS TOP & DOWN LEFT)';
    } else {
      trackU.classList.add('ilu-active');
      if (statusText) statusText.textContent = 'PHASE 3: "U" STROKE (UP RIGHT, ACROSS, DOWN LEFT)';
    }
  }

  function paint(){
    digitEl.textContent = done ? '✓' : fmt(rem);
    var off = C * (1 - rem/seconds);
    ringFg.setAttribute('stroke-dashoffset', done ? 0 : off);
    updateIluGraphic();
  }
  function renderControls(){
    controls.innerHTML = '';
    if (!live && !done){
      var b = document.createElement('button');
      b.className = 'timer-btn'; b.type = 'button';
      b.textContent = rem < seconds ? '▶ Resume' : ('▶ Start ' + (seconds>=60 ? Math.round(seconds/60)+'-min timer' : seconds+'s timer'));
      b.onclick = start;
      controls.appendChild(b);
    }
    if (live){
      var p = document.createElement('button');
      p.className = 'timer-btn'; p.type = 'button'; p.textContent = '⏸ Pause';
      p.onclick = pause;
      controls.appendChild(p);
    }
    if (done || (!live && rem < seconds)){
      var r = document.createElement('button');
      r.className = 'timer-btn'; r.type = 'button'; r.textContent = '↺';
      r.onclick = reset;
      controls.appendChild(r);
    }
    noteSlot.innerHTML = done
      ? '<div class="timer-done-note">✓ Step Complete — tap continue below</div>'
      : (label ? '<div class="timer-note">'+label+'</div>' : '');
  }
  function tick(){
    rem -= 1;
    if (rem <= 0){
      rem = 0; live = false; done = true;
      clearInterval(interval); interval = null;
      paint(); renderControls();
      onDone();
      return;
    }
    paint();
  }
  function start(){
    if (live || done) return;
    live = true;
    paint(); renderControls();
    interval = setInterval(tick, 1000);
  }
  function pause(){
    live = false;
    if (interval) clearInterval(interval);
    interval = null;
    renderControls();
  }
  function reset(){
    live = false; done = false; rem = seconds;
    if (interval) clearInterval(interval);
    interval = null;
    paint(); renderControls();
  }
  paint(); renderControls();

  return function cleanup(){ if (interval) clearInterval(interval); };
}

function mountBreathingOrb(container, onDone){
  var t = 0, timeout = null, stopped = false;
  var TOTAL = 21;
  var wrap = document.createElement('div');
  wrap.className = 'orb-wrap';
  wrap.innerHTML =
    '<div class="orb" style="width:110px;height:110px;background:rgba(224,189,117,0.14);border-color:var(--gold);">' +
      '<span class="n" style="font-size:32px;color:var(--gold);"></span>' +
    '</div>' +
    '<div class="lbl" style="margin-top:16px;font-size:15px;font-weight:600;color:var(--gold);min-height:20px;"></div>' +
    '<div class="cyc" style="font-size:11.5px;color:var(--muted-2);margin-top:5px;"></div>';
  container.appendChild(wrap);
  var orb = wrap.querySelector('.orb');
  var num = wrap.querySelector('.n');
  var lbl = wrap.querySelector('.lbl');
  var cyc = wrap.querySelector('.cyc');

  function frame(){
    if (stopped) return;
    if (t >= TOTAL){ onDone(); return; }
    var pos = t % 7;
    var phase = pos < 3 ? 'in' : pos < 4 ? 'hold' : 'out';
    var count = phase === 'in' ? (3 - pos) : phase === 'hold' ? 1 : (7 - pos);
    var cycleNum = Math.floor(t/7) + 1;
    var sz = phase === 'out' ? 82 : 124;
    var col = phase === 'in' ? '#93b394' : phase === 'hold' ? '#e0bd75' : '#dd8058';
    orb.style.width = sz+'px'; orb.style.height = sz+'px';
    orb.style.borderColor = col;
    orb.style.background = col === '#93b394' ? 'rgba(147,179,148,0.18)' : col === '#e0bd75' ? 'rgba(224,189,117,0.18)' : 'rgba(221,128,88,0.18)';
    num.style.color = col; num.textContent = count;
    lbl.textContent = phase === 'in' ? 'Breathe in slowly…' : phase === 'hold' ? 'Hold…' : 'Release and exhale…';
    lbl.style.color = col;
    cyc.textContent = 'Breath ' + cycleNum + ' of 3';
    t++;
    timeout = setTimeout(frame, 1000);
  }
  frame();
  return function cleanup(){ stopped = true; if (timeout) clearTimeout(timeout); };
}

    ['noise','Brown noise on','60\u201365 dB, speaker 7+ feet from baby'],

    '<div class="screen-body">' +
      '<div class="dots">' + dotsHTML(2) + '</div>' +
      '<div class="eyebrow" style="color:var(--sage)">Stage 2 · Environment Reset</div>' +

      '<button class="btn btn-sage" data-act="continue" disabled>Continue →</button>' +
      '<div class="skiplink"><button class="btn-link" data-act="skip">Skip for now, every minute counts</button></div>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    var fill = $(el,'[data-fill]'), cont = $(el,'[data-act=continue]');
    function update(){
      var on = $all(el,'.toggle-row.on').length;
      fill.style.width = Math.round((on/items.length)*100) + '%';
      cont.disabled = on < items.length;
    }
    $all(el, '.toggle-row').forEach(function(row){
      row.addEventListener('click', function(){ row.classList.toggle('on'); update(); });
    });
    cont.addEventListener('click', function(){ goTo('environmentCheck'); });
    $(el,'[data-act=skip]').addEventListener('click', function(){ goTo('environmentCheck'); });
  }
  return { el:el, mount:mount };
}
