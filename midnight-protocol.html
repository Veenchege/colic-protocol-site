<style>
:root{
  --bg:#100d0a; --bg-soft:#15100c; --card:rgba(31,25,16,0.78); --card-2:rgba(37,29,20,0.85);
  --border:rgba(244,237,228,0.11); --border-strong:rgba(244,237,228,0.22);
  --cream:#f5efe6; --muted:#ab9c8b; --muted-2:#756652;
  --terra:#dd8058; --terra-soft:rgba(221,128,88,0.16); --terra-line:rgba(221,128,88,0.48); --terra-deep:#c4603a;
  --sage:#93b394; --sage-soft:rgba(147,179,148,0.16); --sage-line:rgba(147,179,148,0.48);
  --gold:#e0bd75; --gold-soft:rgba(224,189,117,0.16); --gold-line:rgba(224,189,117,0.48);
  --blush:#e6a189; --blush-soft:rgba(230,161,137,0.16); --blush-line:rgba(230,161,137,0.48);
  --red:#e2685c; --red-soft:rgba(226,104,92,0.16); --red-line:rgba(226,104,92,0.55);
  --green:#8fbf9a;
  --shadow:0 24px 70px rgba(0,0,0,0.65);
  --shadow-glow:0 0 35px rgba(224,189,117,0.12);
  --r-lg:24px; --r-md:16px; --r-sm:11px;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,-apple-system,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse 720px 520px at 12% 6%, rgba(221,128,88,0.18), transparent 60%),
    radial-gradient(ellipse 640px 520px at 88% 94%, rgba(147,179,148,0.15), transparent 60%),
    radial-gradient(ellipse 900px 800px at 50% 45%, rgba(224,189,117,0.065), transparent 70%),
    #080604;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--sans); color:var(--cream);
  padding:22px 12px; -webkit-font-smoothing:antialiased;
}
input,select,textarea,button{font-family:inherit;}
button{-webkit-tap-highlight-color:transparent;}
::selection{background:var(--terra-soft); color:var(--cream);}

.phone{
  width:100%; max-width:446px; min-height:min(890px,95vh);
  background:linear-gradient(180deg, #16120d 0%, #100d0a 100%);
  border-radius:36px; border:1px solid var(--border-strong);
  box-shadow:var(--shadow), 0 0 40px rgba(221,128,88,0.08);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
}
.phone::before{
  content:''; position:absolute; top:-120px; left:50%; transform:translateX(-50%);
  width:360px; height:280px; border-radius:50%;

  pointer-events:none; z-index:0;
}
#app{position:relative; z-index:1; flex:1; display:flex; flex-direction:column;}

}

/* ── layout ─────────────────────────────────────────────── */
.screen{display:flex; flex-direction:column; flex:1; padding:28px 22px 24px; animation:screenIn .38s cubic-bezier(.16,1,.3,1);}
.screen.center{justify-content:center;}
.screen-body{flex:1; display:flex; flex-direction:column;}
.screen-foot{margin-top:16px;}

.eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.17em; text-transform:uppercase; margin-bottom:11px; display:flex; align-items:center; gap:9px; font-weight:500;}
.eyebrow::before{content:''; width:18px; height:1px; background:currentColor; opacity:.65;}

.h1{font-family:var(--serif); font-size:28px; font-weight:700; line-height:1.15; margin:0 0 10px; color:var(--cream); letter-spacing:-.01em;}
.h1 i{font-style:italic; color:var(--terra); font-weight:600;}
.h2{font-family:var(--serif); font-size:22px; font-weight:700; line-height:1.2; margin:0 0 8px;}
.sub{color:var(--muted); font-size:14px; line-height:1.65; margin-bottom:4px;}
.center-text{text-align:center;}

.dots{display:flex; gap:8px; justify-content:center; margin-bottom:20px;}
.dot{height:6px; border-radius:4px; background:rgba(244,237,228,0.18); transition:all .35s ease; width:6px;}
.dot.active{width:24px; background:var(--gold); box-shadow:0 0 10px rgba(224,189,117,0.5);}
.dot.done{background:var(--sage); opacity:.85;}

.stepbar{display:flex; gap:5px; margin-bottom:18px;}
.stepbar i{flex:1; height:3.5px; border-radius:2px; background:rgba(244,237,228,0.14); font-style:normal; transition:background .3s ease;}
.stepbar i.on{background:currentColor; box-shadow:0 0 8px currentColor;}
.stepbar i.past{background:currentColor; opacity:.45;}

.btn{width:100%; min-height:54px; border-radius:15px; border:none; font-weight:700; font-size:15.5px;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .12s ease, filter .15s ease, opacity .15s ease, box-shadow .2s ease; letter-spacing:.005em;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,#e8935f,var(--terra-deep)); color:#190b04; box-shadow:0 10px 28px rgba(221,128,88,.32);}

.btn-outline:hover{background:var(--terra-soft); border-color:var(--terra);}
.btn-outline.sage{border-color:var(--sage-line); color:var(--sage); background:rgba(147,179,148,0.04);}
.btn-link{background:none; border:none; color:var(--muted); font-size:12.5px; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:8px;}
.btn:disabled{opacity:.35; cursor:not-allowed; filter:grayscale(.35); box-shadow:none;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

.field:focus-visible,.btn:focus-visible,.toggle-row:focus-visible,.opt:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.card.tint-sage{background:linear-gradient(180deg, rgba(147,179,148,.12), rgba(147,179,148,.04)); border-color:var(--sage-line); box-shadow:0 8px 30px rgba(147,179,148,0.08);}

.toggle-row{display:flex; align-items:center; gap:13px; padding:13px 4px; cursor:pointer; user-select:none; border-radius:10px; transition:background .2s ease;}
.toggle-row:hover{background:rgba(244,237,228,0.03);}

.toggle-box{margin-top:1px;}
.why-btn{display:block;}
.why-body{max-width:none !important; overflow-wrap:anywhere;}
.toggle-text b{display:block; font-size:14px; font-weight:600; color:var(--cream); margin-bottom:1px;}
.toggle-text span{font-size:12px; color:var(--muted);}
.progress-track{height:4px; background:var(--border); border-radius:3px; overflow:hidden; margin:16px 0 4px;}

.why-btn{background:none; border:none; padding:5px 0 0; margin:0; font-family:inherit; font-size:11.5px; font-weight:600; color:var(--sage); cursor:pointer; text-align:left;}

.solidarity-note{display:flex; gap:10px; align-items:flex-start; background:rgba(147,179,148,0.08); border:1px solid var(--sage-line); border-radius:12px; padding:12px 14px; margin-top:14px; font-size:12px; color:var(--cream); line-height:1.6;}
.solidarity-note svg{flex-shrink:0; color:var(--sage); margin-top:1px;}

.danger-item{display:flex; align-items:center; gap:13px; padding:14px 4px; cursor:pointer; border-radius:10px; transition:background .15s;}
.danger-item:hover{background:rgba(226,104,92,0.08);}
.danger-item + .danger-item{border-top:1px solid var(--border);}
.danger-check{width:25px; height:25px; border-radius:50%; border:1.5px solid var(--red-line);
  flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:all .2s;}
.danger-item.on .danger-check{background:var(--red); box-shadow:0 0 12px rgba(226,104,92,0.6);}
.danger-check svg{width:13px; height:13px; opacity:0;}

.danger-item.on .danger-check svg{opacity:1;}
.danger-item.on .danger-check svg path{stroke-dashoffset:0;}
.danger-item b{font-size:14px; font-weight:600; line-height:1.4;}

.opt{width:100%; min-height:60px; border-radius:15px; text-align:left; padding:0 18px;
  display:flex; align-items:center; gap:13px; font-weight:600; font-size:14.5px;
  border:1px solid; cursor:pointer; margin-bottom:10px; background:none; color:var(--cream); transition:transform .12s, box-shadow .2s, border-color .2s;}
.opt:active{transform:scale(.98);}
.opt:last-child{margin-bottom:0;}
.opt .dot-ind{width:9px; height:9px; border-radius:50%; flex-shrink:0;}

.opt-good .dot-ind{background:var(--sage); box-shadow:0 0 8px var(--sage);}
.opt-mid{border-color:var(--gold-line); background:var(--gold-soft);}
.opt-mid:hover{box-shadow:0 0 18px rgba(224,189,117,0.25);}
.opt-mid .dot-ind{background:var(--gold); box-shadow:0 0 8px var(--gold);}
.opt-low{border-color:var(--red-line); background:var(--red-soft);}
.opt-low:hover{box-shadow:0 0 18px rgba(226,104,92,0.25);}
.opt-low .dot-ind{background:var(--red); box-shadow:0 0 8px var(--red);}

.illus{width:100%; border-radius:18px; overflow:hidden; margin-bottom:16px; border:1px solid var(--border); background:#0c0906; position:relative; box-shadow:inset 0 0 30px rgba(0,0,0,0.5);}
.illus svg{width:100%; height:auto; display:block;}

.steps-list{list-style:none; margin:0 0 6px; padding:0; counter-reset:step;}

.steps-list li::before{content:counter(step); font-family:var(--mono); font-size:11px; font-weight:600;

  color:var(--gold); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px;}

.timer-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; margin:14px 0 6px; position:relative;}
.tip-hint{font-size:13px;color:var(--muted);background:rgba(255,255,255,.5);border:1px solid rgba(0,0,0,.07);border-radius:10px;padding:10px 14px;margin-top:12px;line-height:1.55;text-align:center;}

.timer-controls{display:flex; gap:8px;}

}

.vs-row .val{font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap;}

.sys-card b{display:block; font-size:14px; margin-bottom:3px;}
.sys-card p{margin:0; font-size:12px; color:var(--muted); line-height:1.55;}

.expand{border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--card); backdrop-filter:blur(10px);}

(function captureUTMandHandoff(){
  try{
    var p = new URLSearchParams(window.location.search);
    state.utm.utm_source = p.get('utm_source') || CONFIG.SOURCE;
    state.utm.utm_medium = p.get('utm_medium') || '';
    state.utm.utm_campaign = p.get('utm_campaign') || '';
    state.utm.utm_term = p.get('utm_term') || '';
    state.utm.utm_content = p.get('utm_content') || '';
    // Quiz assessment ID (CP-...) travels in from the quiz handoff. Kept
    // separate from this session's own MP- ID so neither overwrites the other.
    var aidParam = (p.get('aid') || '').trim();
    if (/^CP-[A-Za-z0-9-]{3,40}$/.test(aidParam)) state.quizAssessmentId = aidParam;
    var t = (p.get('type') || '').toUpperCase();
    if (TYPE_MAP[t]){ state.colicType = t; state.colicTypeFromQuiz = true; }
    var confParam = p.get('confidence');
    if (confParam !== null && confParam !== '' && !isNaN(Number(confParam))){
      var confNum = Number(confParam);
      if (confNum >= 0 && confNum <= 100) state.colicTypeConfidence = confNum;
    }
    var nameParam = (p.get('name') || '').trim();
    var ageParam = p.get('age');
    if (nameParam) state.lead.name = nameParam.slice(0, 60);
    if (ageParam !== null && ageParam !== '' && !isNaN(Number(ageParam))){
      var ageNum = Number(ageParam);
      if (ageNum >= 0 && ageNum <= 60) state.lead.babyAgeWeeks = ageNum;
    }
  }catch(e){}
})();

function withUTM(url, campaign){
  try{
    var isAbsolute = /^https?:\/\//i.test(url);
    var u = new URL(url, window.location.origin);
    u.searchParams.set('utm_source', state.utm.utm_source);
    u.searchParams.set('utm_medium', state.utm.utm_medium || 'midnight_protocol');
    u.searchParams.set('utm_campaign', campaign || state.utm.utm_campaign || 'midnight_protocol');
    return isAbsolute ? u.href : (u.pathname + u.search);
  }catch(e){ return url; }
}

function post(extra){
  try{
    var body = Object.assign({
      name: state.lead.name,
      email: state.lead.email,
      website: state.lead.hp || '',
      consent: !!state.lead.consent,
      baby_age_weeks: state.lead.babyAgeWeeks,
      colic_type: state.colicType ? (TYPE_MAP[state.colicType] ? TYPE_MAP[state.colicType].label : 'Unassigned') : '',
      colic_type_detail: state.colicTypeFromQuiz ? 'Confirmed from quiz handoff' : (state.colicType ? 'Selected in Midnight Protocol' : ''),
      // Only meaningful when it actually travelled from the quiz (see
      // captureUTMandHandoff), null otherwise. Backend only forwards it
      // when non-null, same clobber-safe pattern as colic_type below.
      colic_type_confidence: state.colicTypeConfidence,
      assessment_id: ASSESSMENT_ID,
      // Present only when she came from the quiz. Backend should use this
      // for the MailerLite assessment_id field so the CP- ID is never replaced.
      quiz_assessment_id: state.quizAssessmentId || null,
      lead_source: state.utm.utm_source,
      checklist_version: '1.2-vector',
      purchase_status: 'pending'
    }, state.utm, extra || {});
    fetch(CONFIG.ENDPOINT, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      keepalive:true,
      body: JSON.stringify(body)
    })['catch'](function(){});
  }catch(e){}
}
function submitLead(){
  var isBot = (Date.now() - SESSION_STARTED_AT) < 1500;
  if (isBot) return;
  post({ checklist_status:'started', checklist_last_stage:'welcome' });
}
function markStage(stageName, extra){
  if (!state.lead.email) return;
  post(Object.assign({ checklist_status:'in_progress', checklist_last_stage: stageName }, extra || {}));
}
function submitOutcome(stage, result, extraFields){
  if (!state.lead.email) return;
  var extra = { checklist_status:'in_progress', checklist_last_stage: stage };
  extra[stage + '_outcome'] = result;
  // Dwell time: how long the parent actually spent on this stage,
  // recorded silently when a start timestamp exists in state.
  // This replaces the blocking timer as the engagement signal.
  var startKey = stage + 'StartedAt';
  if (state[startKey]) {
    extra[stage + '_dwell_seconds'] = Math.round((Date.now() - state[startKey]) / 1000);
    state[startKey] = null;
  }
  if (extraFields) Object.assign(extra, extraFields);
  post(extra);
}
function submitCompleted(){
  if (!state.lead.email) return;
  post({ checklist_status:'completed', checklist_last_stage:'bridge' });
}

function mountTimer(container, opts){
  var seconds = opts.seconds, color = opts.color || 'var(--terra)',
      pulse = !!opts.pulse, onDone = opts.onDone || function(){}, label = opts.label;
  var rem = seconds, live = false, done = false, interval = null;
  var R = 52, C = 2*Math.PI*R;

  var wrap = document.createElement('div');
  wrap.className = 'timer-wrap' + (pulse ? ' metro-active' : '');
  wrap.innerHTML =
    '<div class="timer-ring">' +
      '<svg width="134" height="134" viewBox="0 0 134 134">' +
        '<circle cx="67" cy="67" r="'+R+'" fill="none" stroke="rgba(244,237,228,0.12)" stroke-width="6"/>' +
        '<circle class="ring-fg" cx="67" cy="67" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="6" ' +
          'stroke-dasharray="'+C+'" stroke-dashoffset="0" stroke-linecap="round"/>' +
      '</svg>' +
      '<div class="timer-digits"><span class="t"></span>'+(pulse?'<span class="p" style="background:'+color+';color:'+color+'"></span>':'')+'</div>' +
    '</div>' +
    (pulse ? '<div class="metro-badge"><span class="metro-dot"></span>60 BPM Rhythm Pulse</div>' : '') +
    '<div class="timer-controls"></div>' +
    '<div class="timer-note-slot"></div>';
  container.appendChild(wrap);

  var ringFg = wrap.querySelector('.ring-fg');
  var digitEl = wrap.querySelector('.t');
  var controls = wrap.querySelector('.timer-controls');
  var noteSlot = wrap.querySelector('.timer-note-slot');

  function fmt(s){ var m = Math.floor(s/60), ss = s%60; return m + ':' + (ss<10?'0':'') + ss; }
  
  function updateIluGraphic(){
    var trackI = document.getElementById('ilu-track-i');
    var trackL = document.getElementById('ilu-track-l');
    var trackU = document.getElementById('ilu-track-u');
    var statusText = document.getElementById('ilu-status-text');
    if (!trackI || !trackL || !trackU) return;

    trackI.classList.remove('ilu-active');
    trackL.classList.remove('ilu-active');
    trackU.classList.remove('ilu-active');

    if (!live && rem === seconds){
      if (statusText) statusText.textContent = 'READY TO START CLOCKWISE MASSAGE';
      return;
    }

    if (rem > 45){
      trackI.classList.add('ilu-active');
      if (statusText) statusText.textContent = 'PHASE 1: "I" STROKE (DOWN BABY\'S LEFT)';
    } else if (rem > 25){
      trackL.classList.add('ilu-active');
      if (statusText) statusText.textContent = 'PHASE 2: "L" STROKE (ACROSS TOP & DOWN LEFT)';
    } else {
      trackU.classList.add('ilu-active');
      if (statusText) statusText.textContent = 'PHASE 3: "U" STROKE (UP RIGHT, ACROSS, DOWN LEFT)';
    }
  }

  function paint(){
    digitEl.textContent = done ? '✓' : fmt(rem);
    var off = C * (1 - rem/seconds);
    ringFg.setAttribute('stroke-dashoffset', done ? 0 : off);
    updateIluGraphic();
  }
  function renderControls(){
    controls.innerHTML = '';
    if (!live && !done){
      var b = document.createElement('button');
      b.className = 'timer-btn'; b.type = 'button';
      b.textContent = rem < seconds ? '▶ Resume' : ('▶ Start ' + (seconds>=60 ? Math.round(seconds/60)+'-min timer' : seconds+'s timer'));
      b.onclick = start;
      controls.appendChild(b);
    }
    if (live){
      var p = document.createElement('button');
      p.className = 'timer-btn'; p.type = 'button'; p.textContent = '⏸ Pause';
      p.onclick = pause;
      controls.appendChild(p);
    }
    if (done || (!live && rem < seconds)){
      var r = document.createElement('button');
      r.className = 'timer-btn'; r.type = 'button'; r.textContent = '↺';
      r.onclick = reset;
      controls.appendChild(r);
    }
    noteSlot.innerHTML = done
      ? '<div class="timer-done-note">✓ Step complete, tap continue below</div>'
      : (label ? '<div class="timer-note">'+label+'</div>' : '');
  }
  function tick(){
    rem -= 1;
    if (rem <= 0){
      rem = 0; live = false; done = true;
      clearInterval(interval); interval = null;
      paint(); renderControls();
      onDone();
      return;
    }
    paint();
  }
  function start(){
    if (live || done) return;
    live = true;
    paint(); renderControls();
    interval = setInterval(tick, 1000);
  }
  function pause(){
    live = false;
    if (interval) clearInterval(interval);
    interval = null;
    renderControls();
  }
  function reset(){
    live = false; done = false; rem = seconds;
    if (interval) clearInterval(interval);
    interval = null;
    paint(); renderControls();
  }
  paint(); renderControls();

  return function cleanup(){ if (interval) clearInterval(interval); };
}

// Count-up, never-blocking timer for the Tiger Hold (and any future
// technique screen that wants one). Unlike mountTimer, there is no
// target duration and it never disables the continue button — the
// ring simply completes one lap every 60 seconds as a rhythm aid,
// then starts the next lap while the digits keep the true running
// total. getElapsed() returns total active (non-paused) seconds so
// the calling screen can record it when the parent moves on.
function mountStopwatch(container, opts){
  var color = (opts && opts.color) || 'var(--gold)', pulse = !!(opts && opts.pulse);
  var elapsed = 0, live = false, interval = null;
  var R = 52, C = 2*Math.PI*R;
  var NOTES = [
    { at:0,   text:'Tap start once baby is in position and the pulse begins.' },
    { at:15,  text:'Keep the pulse steady. Many babies need 30–60 seconds before the shift starts.' },
    { at:45,  text:'You\u2019re in the window where it usually starts working.' },
    { at:90,  text:'Past a minute in, this is often where things turn. No need to stop yet.' },
    { at:150, text:'Longer generally helps here, there\u2019s no fixed target. Stop whenever baby, or your arm, needs a break.' }
  ];

  var wrap = document.createElement('div');
  wrap.className = 'timer-wrap' + (pulse ? ' metro-active' : '');
  wrap.innerHTML =
    '<div class="timer-ring">' +
      '<svg width="134" height="134" viewBox="0 0 134 134">' +
        '<circle cx="67" cy="67" r="'+R+'" fill="none" stroke="rgba(244,237,228,0.12)" stroke-width="6"/>' +
        '<circle class="ring-fg" cx="67" cy="67" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="6" ' +
          'stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" stroke-linecap="round"/>' +
      '</svg>' +
      '<div class="timer-digits"><span class="t">0:00</span>'+(pulse?'<span class="p" style="background:'+color+';color:'+color+'"></span>':'')+'</div>' +
    '</div>' +
    (pulse ? '<div class="metro-badge"><span class="metro-dot"></span>60 BPM Rhythm Pulse</div>' : '') +
    '<div class="timer-controls"></div>' +
    '<div class="timer-note-slot"></div>';
  container.appendChild(wrap);

  var ringFg = wrap.querySelector('.ring-fg');
  var digitEl = wrap.querySelector('.t');
  var controls = wrap.querySelector('.timer-controls');
  var noteSlot = wrap.querySelector('.timer-note-slot');

  function fmt(s){ var m = Math.floor(s/60), ss = s%60; return m + ':' + (ss<10?'0':'') + ss; }
  function noteFor(s){
    var n = NOTES[0].text;
    for (var i=0;i<NOTES.length;i++){ if (s >= NOTES[i].at) n = NOTES[i].text; }
    return n;
  }
  function paint(){
    digitEl.textContent = fmt(elapsed);
    var lap = elapsed % 60;
    ringFg.setAttribute('stroke-dashoffset', C * (1 - lap/60));
    if (!live && elapsed === 0){
      noteSlot.innerHTML = '<div class="timer-note">'+NOTES[0].text+'</div>';
    } else {
      noteSlot.innerHTML = '<div class="timer-note">'+noteFor(elapsed)+'</div>';
    }
  }
  function renderControls(){
    controls.innerHTML = '';
    if (!live){
      var b = document.createElement('button');
      b.className = 'timer-btn'; b.type = 'button';
      b.textContent = elapsed > 0 ? '▶ Resume' : '▶ Start';
      b.onclick = start;
      controls.appendChild(b);
    } else {
      var p = document.createElement('button');
      p.className = 'timer-btn'; p.type = 'button'; p.textContent = '⏸ Pause';
      p.onclick = pause;
      controls.appendChild(p);
    }
    if (elapsed > 0){
      var r = document.createElement('button');
      r.className = 'timer-btn'; r.type = 'button'; r.textContent = '↺';
      r.onclick = reset;
      controls.appendChild(r);
    }
  }
  function tick(){ elapsed += 1; paint(); }
  function start(){
    if (live) return;
    live = true;
    paint(); renderControls();
    interval = setInterval(tick, 1000);
  }
  function pause(){
    live = false;
    if (interval) clearInterval(interval);
    interval = null;
    renderControls();
  }
  function reset(){
    live = false; elapsed = 0;
    if (interval) clearInterval(interval);
    interval = null;
    paint(); renderControls();
  }
  paint(); renderControls();

  return {
    cleanup: function(){ if (interval) clearInterval(interval); },
    getElapsed: function(){ return elapsed; }
  };
}

function mountBreathingOrb(container, onDone){
  var t = 0, timeout = null, stopped = false;
  var TOTAL = 21;
  var wrap = document.createElement('div');
  wrap.className = 'orb-wrap';
  wrap.innerHTML =
    '<div class="orb" style="width:110px;height:110px;background:rgba(224,189,117,0.14);border-color:var(--gold);">' +
      '<span class="n" style="font-size:32px;color:var(--gold);"></span>' +
    '</div>' +
    '<div class="lbl" style="margin-top:16px;font-size:15px;font-weight:600;color:var(--gold);min-height:20px;"></div>' +
    '<div class="cyc" style="font-size:11.5px;color:var(--muted-2);margin-top:5px;"></div>';
  container.appendChild(wrap);
  var orb = wrap.querySelector('.orb');
  var num = wrap.querySelector('.n');
  var lbl = wrap.querySelector('.lbl');
  var cyc = wrap.querySelector('.cyc');

  function frame(){
    if (stopped) return;
    if (t >= TOTAL){ onDone(); return; }
    var pos = t % 7;
    var phase = pos < 3 ? 'in' : pos < 4 ? 'hold' : 'out';
    var count = phase === 'in' ? (3 - pos) : phase === 'hold' ? 1 : (7 - pos);
    var cycleNum = Math.floor(t/7) + 1;
    var sz = phase === 'out' ? 82 : 124;
    var col = phase === 'in' ? '#93b394' : phase === 'hold' ? '#e0bd75' : '#dd8058';
    orb.style.width = sz+'px'; orb.style.height = sz+'px';
    orb.style.borderColor = col;
    orb.style.background = col === '#93b394' ? 'rgba(147,179,148,0.18)' : col === '#e0bd75' ? 'rgba(224,189,117,0.18)' : 'rgba(221,128,88,0.18)';
    num.style.color = col; num.textContent = count;
    lbl.textContent = phase === 'in' ? 'Breathe in slowly…' : phase === 'hold' ? 'Hold…' : 'Release and exhale…';
    lbl.style.color = col;
    cyc.textContent = 'Breath ' + cycleNum + ' of 3';
    t++;
    timeout = setTimeout(frame, 1000);
  }
  frame();
  return function cleanup(){ stopped = true; if (timeout) clearTimeout(timeout); };
}

function buildTechniqueScreen(cfg){
  var topHtml = '';
  if (cfg.stageDots){ topHtml += '<div class="dots">' + dotsHTML(cfg.stageDots) + '</div>'; }
  topHtml += '<div class="eyebrow" style="color:'+cfg.color+'">'+esc(cfg.eyebrow)+'</div>';
  if (cfg.stepbar){
    var sb = '';
    for (var i=0;i<cfg.stepbar.total;i++){
      sb += '<i class="'+(i<cfg.stepbar.current-1?'past':(i===cfg.stepbar.current-1?'on':''))+'" style="color:'+cfg.color+'"></i>';
    }
    topHtml += '<div class="stepbar">'+sb+'</div>';
  }
  if (cfg.badge){ topHtml += cfg.badge; }
  var stepsHtml = '<ul class="steps-list">' + cfg.steps.map(function(s){ return '<li>'+s+'</li>'; }).join('') + '</ul>';
  var imgHtml = '<div class="illus" style="padding:0;">' + cfg.svg + '</div>';
  var html =
    '<div class="screen-body">' +
      topHtml +
      '<h1 class="h1" style="font-size:24px; margin-bottom:14px;">'+esc(cfg.title)+'</h1>' +
      imgHtml +
      stepsHtml +
      (cfg.safety ? '<div class="card tint-red" style="margin-top:12px; font-size:12px; color:var(--cream); line-height:1.6;"><b style="color:var(--red);">Safety: </b>'+cfg.safety+'</div>' : '') +
      // stopwatch: a count-up, never-blocking timer (see mountStopwatch).
      // tipLabel: a static guidance hint, can appear alongside the stopwatch
      // or on its own. Legacy timer path (seconds) kept below for any
      // screen that still wants a countdown, but nothing currently uses it.
      (cfg.stopwatch ? '<div data-timer></div>' : (cfg.tipLabel ? '' : '<div data-timer></div>')) +
      (cfg.tipLabel ? '<div class="tip-hint">'+esc(cfg.tipLabel)+'</div>' : '') +
    '</div>' +
    '<div class="screen-foot">' +
      '<button class="btn btn-primary" data-act="continue">'+esc(cfg.continueLabel||'Done, next →')+'</button>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    var contBtn = $(el,'[data-act=continue]');
    var stopwatchApi = null;
    if (cfg.stopwatch){
      // Non-blocking on purpose: this never touches contBtn.disabled.
      // Parents can leave whenever baby needs them to, the timer is a
      // pacing aid, not a gate.
      var swSlot = $(el,'[data-timer]');
      stopwatchApi = mountStopwatch(swSlot, { color: cfg.color, pulse: !!cfg.pulse });
      state.cleanups.push(stopwatchApi.cleanup);
    } else if (cfg.seconds){
      // Legacy countdown path, retained in case a future screen wants a
      // hard timer. Unused by every current screen.
      var slot = $(el,'[data-timer]');
      var cleanup = mountTimer(slot, {
        seconds: cfg.seconds, color: cfg.color, pulse: !!cfg.pulse, label: cfg.timerLabel,
        onDone: function(){ contBtn.disabled = false; }
      });
      state.cleanups.push(cleanup);
    }
    contBtn.addEventListener('click', function(){
      if (contBtn.disabled) return;
      if (stopwatchApi && cfg.onStopwatchElapsed) cfg.onStopwatchElapsed(stopwatchApi.getElapsed());
      cfg.onContinue();
    });
  }
  return { el:el, mount:mount };
}

function renderColicType(){
  var order = ['GUT','NS','FM'];
  var fromQuiz = state.colicTypeFromQuiz && TYPE_MAP[state.colicType];
  // Honesty threshold: below 60%, the quiz's own signal for this
  // respondent was genuinely mixed (see the QUESTIONS comment block on
  // the quiz side for why that happens), so the badge and headline say
  // "leaned toward" instead of an unqualified checkmark. The type is
  // still pre-selected either way, a best guess is still a better
  // starting point than none, it just isn't presented as more certain
  // than it actually was. Confidence only exists when it truly travelled
  // from the quiz handoff (see captureUTMandHandoff) — a null value
  // means we have no signal either way, so the copy stays at its
  // original, unqualified wording rather than guessing at uncertainty
  // we don't have data for.
  var conf = state.colicTypeConfidence;
  var lowConfidence = fromQuiz && conf !== null && conf < 60;
  var cardsHtml = order.map(function(code){
    var t = TYPE_MAP[code];
    var pre = fromQuiz && state.colicType === code;
    var preTag = pre
      ? (lowConfidence
          ? ' <b style="color:var(--gold);">leaning this way, from your assessment</b>'
          : ' <b style="color:var(--sage);">\u2713 from your assessment</b>')
      : '';
    return '<button class="opt '+(pre?'opt-good':'')+'" data-type="'+code+'" style="'+(pre?'':'border-color:var(--border-strong); background:none;')+'">' +
      '<span style="font-size:18px;">'+t.emoji+'</span>' +
      '<span>'+t.label+preTag+'</span>' +
    '</button>';
  }).join('');
  var headline = !fromQuiz
    ? 'Already know what\u2019s\ndriving it tonight?'
    : (lowConfidence ? 'Your answers leaned\ntoward one system.' : 'We\u2019ll tailor tonight\naround your result.');
  var subText = !fromQuiz
    ? 'If you\u2019ve taken the free assessment, tell us. We\u2019ll highlight the step that matters most for your baby\u2019s type.'
    : (lowConfidence
        ? 'It wasn\u2019t a clear-cut signal, your baby\u2019s answers touched more than one system. This is our best read, confirm it if it fits tonight, or switch if it doesn\u2019t.'
        : 'Your assessment pointed to one system. Confirm it, or pick a different one if tonight feels different.');
  var html =
    '<div class="screen-body">' +
      '<div class="eyebrow" style="color:var(--terra)">Optional · 5 seconds</div>' +
      '<h1 class="h1" style="font-size:23px; white-space:pre-line;">' + headline + '</h1>' +
      '<p class="sub">' + subText + '</p>' +
      '<div style="margin-top:14px;">' + cardsHtml +

      '</div>' +
    '</div>';
  var el = buildScreen(html);
  function mount(){
    $all(el, '[data-type]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var code = btn.getAttribute('data-type');

        markStage('colic_type');

      });
    });
  }
  return { el:el, mount:mount };
}

function renderFinalCheck(){
  state.finalStartedAt = Date.now();
  // Gas Release (bicycleLegs → iluMassage → footballHold → warmCompress) has
  // no outcome-check screen of its own, so nothing else ever reads
  // gas_releaseStartedAt. Capture it here, right as the parent arrives,
  // and ride along on the 'final' submit so it isn't lost. Only babies
  // routed through the gas-release sequence will have this set.
  var gasReleaseSeconds = state.gas_releaseStartedAt
    ? Math.round((Date.now() - state.gas_releaseStartedAt) / 1000)
    : null;
  state.gas_releaseStartedAt = null;
  return buildOutcomeScreen({
    eyebrowColor:'var(--terra)',
    title:'After everything tonight…',
    sub:'Where’s baby right now?',
    onPick:function(val){
      state.outcomes.final = val;
      var extra = {};
      if (gasReleaseSeconds !== null) extra.gas_release_dwell_seconds = gasReleaseSeconds;
      submitOutcome('final', val, extra);
      submitCompleted();
      goTo('bridge');
    }
  });
}

    '<div class="ic" style="background:var(--'+sys.tint+'-soft); color:var(--'+sys.tint+');">'+sys.icon+'</div>' +
    '<div><b style="color:var(--cream); display:flex; align-items:center; flex-wrap:wrap; gap:2px;">'+sys.name+matchTag+'</b><p>'+sys.signs+'</p></div>' +
  '</div>';
}

        '<div class="expand-body" style="padding-top:10px;"><img src="'+IMG['infant_crying_intensity_chart_202608312322']+'" alt="24-hour infant crying and hormone chart" style="width:100%; height:auto; display:block; border-radius:var(--r-sm);"></div>' +

      '<div class="card">' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Diagnostic Protocol, all three systems</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Full sequenced protocol for your primary system</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Bloom Baby Tracker App</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'60-Minute Brown Noise Soundscape</div></div>' +
        '<div class="vs-row"><div class="nm">'+ICONS.leaf+'Cry Decoder Masterclass</div></div>' +
        '<div class="vs-total"><span class="lbl">Complete system, tonight</span><span class="amt">$47</span></div>' +
      '</div>' +
      '<div class="card tint-sage" style="margin-top:12px;">' +

root = document.getElementById('app');
